        anvers: "Anvers, septembre 1520. Seize ans ont passé : tu as maintenant 36 ans. Le port déborde de navires venus de Lisbonne, de Londres et de la Baltique.",
        cologne: "Cologne, novembre 1520. Il fait froid, il neige un peu. Le nouvel empereur et sa cour sont en ville, et une fumée noire monte devant la cathédrale."
      }[id];
      setTimeout(() => Dialog.run([narr(txt), narr(isTouch ? "Déplace-toi avec les flèches à l'écran ou en touchant le sol. Touche une personne pour lui parler." : "Déplace-toi avec les flèches (ou ZQSD/WASD). Parle et agis avec Espace. Tu peux aussi cliquer sur le sol ou sur une personne. Ton carnet : touche C.")]), 350);
    }
  },
  leaveCity() {
    const r = remaining(city.id);
    const back = () => { placePlayer(player.fx, player.fy, player.dir); };
    const next = { florence: 'anvers', anvers: 'cologne', cologne: null }[city.id];
    if (r.length) { Dialog.run([narr("Tu ne peux pas partir tout de suite : " + (r.length === 1 ? "une étoile de cette ville t'attend encore." : "deux étoiles de cette ville t'attendent encore.")), narr(clues(r))], back); return; }
    const label = next ? 'Partir pour ' + ({ anvers: 'Anvers', cologne: 'Cologne' }[next]) : 'Prendre la route du retour';
    Dialog.run([{ n: null, t: next === 'anvers' ? "Quitter Florence? Seize années passeront avant la prochaine étape." : next === 'cologne' ? 'Quitter Anvers pour Cologne?' : 'Quitter Cologne et rentrer chez toi?', choice: [
      { t: label, fn: () => { Dialog.close(); const from = city.id; fade(() => { if (next) Game.travel(from, next); else Game.epilogue(); }); return 'stop'; } },
      { t: 'Pas encore', fn: () => { back(); return 'stop'; } }] }]);
  },

  /* ---------- Voyage (carte) ---------- */
  travel(from, to) {
    Dialog.reset(); S.scene = 'travel'; S.city = to; S.pos = null; hideCityUI(); save();
    Travel.start(from, to);
    const T = {
      anvers: { w: '1504 → 1520', h: "D'Italie aux Pays-Bas", t: "Tu quittes Florence. Pendant seize ans, tu voyages, tu apprends le grec, tu échanges des lettres avec des savants de toute l'Europe. Un jour, tu franchis les Alpes vers le nord, jusqu'au grand port d'<b>Anvers</b>." },
      cologne: { w: 'Septembre → novembre 1520', h: 'Vers le Rhin', t: "Tu suis la route des marchands vers l'est, par Maastricht et Aix-la-Chapelle, où le jeune Charles Quint vient d'être couronné. Tu arrives à <b>Cologne</b>, sur le Rhin, une des plus grandes villes de l'Empire." }
    }[to];
    const sc = $('#screen'); sc.hidden = false;
    sc.innerHTML = `<div class="narr side"><div class="when">${T.w}</div><h2>${T.h}</h2><p>${T.t}</p><div class="btnrow"><button class="btn gold" type="button" id="nx">Continuer</button></div></div>`;
    sc.className = 'left';
    $('#nx').onclick = () => { Snd.sel(); if (Travel.p < 1) { Travel.p = 1; return; } sc.className = ''; fade(() => Game.enterCity(to)); };
    setTimeout(() => $('#nx').focus(), 40);
  },

  /* ---------- Idée débloquée ---------- */
  unlock(id) {
    S.ideas[id] = true; save(); updateHUD(); Snd.star();
    const I = IDEA[id], n = nReq();
    const u = $('#unlock'); u.hidden = false;
    const kicker = I.bonus ? I.kicker : `Idée humaniste débloquée · ${n} / 6 · ${DISC[I.disc].label}`;
    u.innerHTML = `<div class="u-in"><canvas id="uStar"></canvas><div class="u-k">${kicker}</div><h2>${I.name}</h2><div class="u-sub">${I.sub}</div><p>${I.def}</p>
      <div class="disc"><b>Pour aller plus loin :</b> ${I.disc_q}</div><button class="btn gold" type="button" id="uOk">Continuer</button></div>`;
    drawStar($('#uStar'), true, 13, DISC[I.disc].color);
    $('#uOk').onclick = () => {
      u.hidden = true; u.innerHTML = ''; Snd.sel();
      if (I.bonus || !city) return;
      const r = remaining(city.id);
      if (!r.length) {
        const dir = { florence: "La route du nord part à gauche, par où tu es arrivé.", anvers: "La route de Cologne part à droite, entre la cathédrale et l'entrepôt.", cologne: "La route du retour part au sud, entre les maisons." }[city.id];
        Dialog.run([narr(`Les deux étoiles de ${city.name} brillent dans ton ciel! ${dir}`)]);
      }
    };
    setTimeout(() => $('#uOk').focus(), 60);
  },

  /* ---------- Carnet ---------- */
  carnet(tab = 'etoiles') {
    if (S.scene !== 'city' && S.scene !== 'end') return;
    const tabs = [['etoiles', 'Étoiles'], ['docs', 'Documents'], ['perso', 'Mon humaniste'], ['gens', 'Personnages']];
    const sh = Panel.open(`<button class="close" data-close type="button">Fermer ✕</button><div class="eyebrow">Carnet de voyage</div><h2>Le carnet de ${esc(S.name)}</h2>
      <div class="tabs" role="tablist">${tabs.map(([k, l]) => `<button class="tab" role="tab" type="button" data-t="${k}" aria-selected="${k === tab}">${l}</button>`).join('')}</div><div id="cz"></div>`);
    sh.querySelectorAll('[data-t]').forEach(b => b.onclick = () => { Game.carnet(b.dataset.t); });
    const cz = sh.querySelector('#cz');
    if (tab === 'etoiles') {
      const row = I => { const on = S.ideas[I.id]; return `<div class="idea ${on ? '' : 'locked'} ${I.bonus ? 'bonus' : ''}"><canvas data-s="${I.id}"></canvas><div><div class="dis">${DISC[I.disc].label} · ${I.bonus ? I.where : { florence: 'Florence', anvers: 'Anvers', cologne: 'Cologne' }[I.city]}</div><div class="in">${on ? `${I.name} <span class="sub">(${I.sub})</span>` : '???'}</div><div style="font-size:.9em">${on ? I.def : I.bonus ? I.hint() : 'Pas encore découverte.'}</div></div></div>`; };
      cz.innerHTML = `<p>${nReq()} idée(s) humaniste(s) sur 6.</p>` + IDEAS.map(row).join('') + `<h3>Étoiles bonus</h3>` + BONUSES.map(row).join('');
      cz.querySelectorAll('[data-s]').forEach(c => drawStar(c, !!S.ideas[c.dataset.s], 13, DISC[IDEA[c.dataset.s].disc].color));
    } else if (tab === 'docs') {
      const all = Object.keys(DOCS);
      cz.innerHTML = `<p>${S.docs.length} document(s) sur ${all.length}. Parle aux gens et explore pour en trouver d'autres.</p>` + (S.docs.length ? S.docs.map(d => docHTML(d)).join('') : '<p><i>Aucun document pour l\'instant.</i></p>');
    } else if (tab === 'perso') {
      const first = firstTryCount(), q = MAIN_Q.filter(k => S.tries[k]).length;
      cz.innerHTML = `<div class="grid2"><div class="preview" style="min-height:200px"><canvas id="cp" width="18" height="22"></canvas><div class="pname">${esc(S.name)}</div><div class="pbg">${BGS[S.bg].label}</div></div>
      <div><p><b>Parcours :</b> Florence (1504, 20 ans) → Anvers (1520, 36 ans) → Cologne (1520).</p>
      <p><b>Questions réussies du premier coup :</b> ${first} sur ${q || 0} répondue(s).</p>
      <p><b>Fragments de l'Antiquité :</b> ${nFrags()} sur 3${S.ideas.antiquite ? ' · étoile bonus allumée ★' : ''}.</p>
      ${S.flags.portrait ? `<p><b>Portrait :</b> dessiné au fusain par Albrecht Dürer, à Anvers, en septembre 1520.</p>` : ''}
      ${S.beta ? '<p><span class="tag" style="background:#1f2b63">Bêta-testeur officiel</span> Tu fais partie des premiers à jouer à ce jeu, avant tout le monde.</p>' : ''}
      <p><b>Ton avantage :</b> ${{ noble: 'ta famille noble t\'a ouvert la tribune de la Seigneurie, à Florence.', religieux: 'ta famille religieuse t\'a ouvert la bibliothèque du couvent, à Cologne.', bourgeois: 'ta famille bourgeoise t\'a ouvert l\'atelier de l\'imprimeur, à Anvers.' }[S.bg]}</p></div></div>`;
      const cp = $('#cp'), g = cp.getContext('2d'); g.drawImage(getSprite(playerLook(), 0, 0), 0, 0);
      if (S.flags.portrait) { cp.style.filter = 'grayscale(1) sepia(.5) contrast(1.2)'; }
    } else {
      const R = [['Nicolas Machiavel', 'Florence', true, "Secrétaire de la République de Florence de 1498 à 1512, auteur du Prince (1513)."], ['Albrecht Dürer', 'Anvers et Cologne', true, "Peintre et graveur de Nuremberg. Il voyage bien aux Pays-Bas en 1520-1521 et passe à Cologne en novembre 1520."], ['Érasme de Rotterdam', 'Cologne', true, "Le plus célèbre humaniste d'Europe. Il est bien à Cologne en novembre 1520."], ['Léonard de Vinci', 'Florence', true, "Peintre, ingénieur et anatomiste. Il est bien à Florence en 1504, où il travaille à la bataille d'Anghiari commandée pour le Palais de la Seigneurie."]];
      const F = [['Bianca, Taddeo, Piero, Nanna, Ginevra, frère Lorenzo, messer Agnolo', 'Florence'], ['Griet, Cornelis, Jan, maître Joris, João, Diego, Lopes, Mieke, Anneke', 'Anvers'], ['Hans, Konrad, Gertrud, frère Ortwin, frère Johann, frère Matthias, Lotte', 'Cologne']];
      cz.innerHTML = `<p>Ce jeu mélange des personnages réels et des personnages inventés, qui représentent les gens de l'époque. Les événements (le David, le bûcher des livres de Luther, le couronnement de Charles Quint) sont réels.</p>
      <h3>Personnages réels</h3>${R.map(r => `<p><span class="tag real">réel</span> <b>${r[0]}</b> (${r[1]}) : ${r[3]}</p>`).join('')}
      <h3>Personnages inventés</h3>${F.map(f => `<p><span class="tag fict">inventé</span> ${f[0]} (${f[1]})</p>`).join('')}
      <p style="font-size:.85em;color:var(--ink2)">Également mentionnés (réels) : Léonard de Vinci, Michel-Ange, Alberti, Savonarole, Lisa del Giocondo, Vasco de Gama, Amerigo Vespucci, Ptolémée, Luther, le nonce Aléandre, Léon X, Charles Quint, Pic de la Mirandole, Thomas More, Agostino di Duccio, Antonio Rossellino, Laurent de Médicis, Giorgio Vasari, Alde Manuce, l'empereur Auguste, l'empereur Claude, Agrippine, Konrad Peutinger, Galien, Mondino de Liuzzi, Ascanio Condivi, Antonio de Beatis, André Vésale.</p>`;
    }
  },

  /* ---------- Menu ---------- */
  menu() {
    if (S.scene !== 'city') return;
    const sh = Panel.open(`<button class="close" data-close type="button">Fermer ✕</button><div class="eyebrow">Pause</div><h2>Menu</h2>
      <div class="field"><span class="lab">Mode de jeu</span><div class="seg"><button type="button" data-m="solo" aria-pressed="${S.mode === 'solo'}">Solo</button><button type="button" data-m="classe" aria-pressed="${S.mode === 'classe'}">Classe (texte agrandi, votes, minuteur)</button></div></div>
      <div class="field"><span class="lab">Son</span><div class="seg"><button type="button" id="mS" aria-pressed="${S.sound}">Effets ${S.sound ? 'activés' : 'coupés'}</button><button type="button" id="mM" aria-pressed="${S.music}">Musique ${S.music ? 'activée' : 'coupée'}</button></div></div>
      <div class="field"><span class="lab">Contrôles tactiles</span><div class="seg"><button type="button" data-tc="auto" aria-pressed="${(S.touch || 'auto') === 'auto'}">Automatique</button><button type="button" data-tc="on" aria-pressed="${S.touch === 'on'}">Toujours afficher</button><button type="button" data-tc="off" aria-pressed="${S.touch === 'off'}">Masquer</button></div></div>
      <p style="font-size:.85em"><b>Clavier :</b> flèches ou ZQSD/WASD pour marcher, Espace ou Entrée pour parler et agir, C pour le carnet, Échap pour ce menu. <b>Souris ou doigt :</b> touche le sol pour t'y rendre, une personne pour lui parler.</p>
      <div class="field"><span class="lab">Code de bêta-testeur</span>${S.beta ? '<p style="margin:0;color:var(--ok);font-weight:700">Code accepté : tu es bêta-testeur officiel!</p>' : '<div style="display:flex;gap:8px;flex-wrap:wrap"><input type="text" id="mCode" maxlength="16" autocomplete="off" style="font-family:var(--serif);font-size:1em;padding:5px 10px;border:2px solid var(--ink);border-radius:3px;background:#fffaf0;color:var(--ink);text-transform:uppercase;max-width:200px"><button class="btn" type="button" id="mCodeOk">Valider</button></div><div id="mCodeMsg" class="nommsg" aria-live="polite"></div>'}</div>
      <h3>Menu enseignant</h3><p style="font-size:.85em;margin-top:0">Aller directement à une ville (utile en projection). La progression est conservée.</p>
      <div class="btnrow" style="margin-top:4px"><button class="btn" type="button" data-go="florence">Florence</button><button class="btn" type="button" data-go="anvers">Anvers</button><button class="btn" type="button" data-go="cologne">Cologne</button><button class="btn" type="button" data-go="epi">Épilogue</button></div>
      <div class="btnrow"><button class="btn gold" type="button" data-close>Reprendre</button><button class="btn ghost" type="button" id="mT">Écran titre</button><button class="btn ghost" type="button" id="mR">Recommencer du début</button></div><div id="mc"></div>`);
    sh.querySelectorAll('[data-m]').forEach(b => b.onclick = () => { S.mode = b.dataset.m; applyMode(); Game.menu(); });
    $('#mS').onclick = () => { S.sound = !S.sound; Game.menu(); };
    $('#mM').onclick = () => { S.music = !S.music; Snd.setMusic(S.music); Game.menu(); };
    sh.querySelectorAll('[data-tc]').forEach(b => b.onclick = () => { S.touch = b.dataset.tc; Panel.close(); showCityUI(); Game.menu(); });
    sh.querySelectorAll('[data-go]').forEach(b => b.onclick = () => { const d = b.dataset.go; Panel.close(); if (d === 'epi') Game.epilogue(); else Game.enterCity(d); });
    $('#mT').onclick = () => { save(); Panel.close(); Game.title(); };
    if ($('#mCodeOk')) { const ok = () => { if (betaCode($('#mCode').value)) { S.beta = true; save(); Snd.ok(); toast('Code accepté : bêta-testeur officiel!'); Game.menu(); } else { Snd.bad(); $('#mCodeMsg').textContent = 'Ce code ne fonctionne pas.'; } }; $('#mCodeOk').onclick = ok; $('#mCode').onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); ok(); } }; }
    $('#mR').onclick = () => { $('#mc').innerHTML = `<div class="fb bad">Toute la progression sera effacée. <button class="btn" type="button" id="mR2" style="margin-left:8px">Oui, recommencer</button></div>`; $('#mR2').onclick = () => { clearSave(); const m = S.mode; S = freshState(); S.mode = m; for (const k in cities) delete cities[k]; Panel.close(); Game.create(); }; };
  },

  /* ---------- Épilogue ---------- */
  epilogue() {
    Dialog.reset(); S.scene = 'epilogue'; S.pos = null; hideCityUI(); save(); Snd.city = 'sky';
    Epi.t0 = performance.now() / 1000; Epi.done = false;
    const sc = $('#screen'); sc.hidden = false; sc.innerHTML = ''; sc.className = 'right';
    setTimeout(() => {
      if (S.scene !== 'epilogue') return;
      const n = nReq();
      sc.innerHTML = `<div class="narr side"><div class="when">Sur la route du retour</div><h2>${n === 6 ? 'Ta constellation est complète' : 'Ta constellation'}</h2>
        <p>${n === 6 ? "Les six idées forment une silhouette humaine dans un cercle, comme l'Homme de Vitruve dessiné par Léonard de Vinci vers 1490 : l'être humain au centre du monde." : `Tu as allumé ${n} étoile(s) sur 6. Les autres attendent encore dans le ciel.`}${S.ideas.antiquite ? " Au-dessus de la tête brille l'étoile dorée de l'Antiquité, d'où les humanistes tirent leur inspiration." : ''}${S.ideas.experience ? " Tout près, l'étoile de Léonard rappelle qu'il faut aller voir de ses propres yeux." : ''}</p>
        <div class="btnrow"><button class="btn gold" type="button" id="nx">Continuer</button></div></div>`;
      $('#nx').onclick = () => { sc.innerHTML = ''; Game.paysanne(); };
      setTimeout(() => $('#nx') && $('#nx').focus(), 40);
    }, 5200);
  },
  paysanne() {
    const p = { name: 'Une paysanne', role: 'sur le bord du chemin', look: LK.paysanne };
    const bgLine = B({ noble: "Ta famille noble t'a ouvert la tribune du David, à Florence.", religieux: "Ta famille religieuse t'a ouvert la bibliothèque du couvent, à Cologne.", bourgeois: "Ta famille bourgeoise t'a ouvert l'atelier de l'imprimeur, à Anvers." }) + " Ailleurs, tu as dû trouver quelqu'un pour te recommander. Et elle, qui l'aurait recommandée?";
    Dialog.run([
      narr("Au bord d'un champ, une paysanne partage son pain avec toi."),
      say(p, "Tu reviens de loin, toi. Florence, Anvers, Cologne… Et tu as trouvé quoi, dans toutes ces villes?"),
      me("Des idées. Que l'être humain est au centre, qu'il peut raisonner, douter, choisir ce qu'il croit et respecter la foi des autres…"),
      say(p, "C'est beau, ça. Mais dis-moi : est-ce que moi, j'aurais pu faire ton voyage?"),
      { n: null, t: 'Que lui réponds-tu?', choice: [
        { t: '« Bien sûr! Tout le monde peut devenir humaniste. »', fn: () => { S.reflect = 'a'; return [say(p, "Tout le monde? Je ne sais pas lire. Je n'ai jamais eu un sou pour voyager, et aucun garde ne m'aurait ouvert une porte."), narr(bgLine)]; } },
        { t: "« Pas vraiment. Il faut savoir lire le latin, avoir de l'argent et des relations. »", fn: () => { S.reflect = 'b'; return [say(p, "Voilà. Tes humanistes parlent de la dignité de l'homme… mais ce sont presque tous des hommes riches qui savent lire."), narr(bgLine)]; } },
        { t: '« Pas encore. Mais si les livres et les écoles se répandent, peut-être un jour. »', fn: () => { S.reflect = 'c'; return [say(p, "Un jour, peut-être. Mes petits-enfants apprendront à lire, qui sait? Grâce à tes imprimeurs."), narr(bgLine)]; } }] }
    ], () => Game.end());
  },
  end() {
    S.scene = 'end'; save();
    const sc = $('#screen'); sc.hidden = true; sc.className = '';
    const n = nReq(), first = firstTryCount();
    const sh = Panel.open(`<div class="eyebrow">Fin du voyage</div><h2>Le ciel de ${esc(S.name)}</h2>
      <div class="grid2"><div class="preview" style="min-height:180px"><canvas id="ep" width="18" height="22"></canvas><div class="pname">${esc(S.name)}</div><div class="pbg">${BGS[S.bg].label} · Florence, Anvers, Cologne</div></div>
      <div><p><b>${n} idée(s) humaniste(s) sur 6</b> · ${first} question(s) réussie(s) du premier coup · ${S.docs.length} document(s) historique(s) dans ton carnet.</p>
      ${IDEAS.map(I => `<p style="margin:.2em 0">${S.ideas[I.id] ? '★' : '☆'} <b>${I.name}</b> <span class="tag">${DISC[I.disc].label}</span></p>`).join('')}
      ${BONUSES.map(I => `<p style="margin:.2em 0">${S.ideas[I.id] ? '★' : '☆'} <b>${I.name}</b> <span class="tag" style="background:#8a5a12">Bonus</span></p>`).join('')}
      ${S.beta ? '<p style="margin:.6em 0 0"><span class="tag" style="background:#1f2b63">Bêta-testeur officiel · 2026</span> Merci d\'avoir testé le jeu en primeur! Les erreurs que tu signales aideront les élèves des autres écoles.</p>' : ''}</div></div>
      <div id="certZone"></div>
      <div class="fb info" style="margin-top:12px"><b>Version bêta :</b> tu as remarqué une erreur, un bogue ou une information douteuse? Note-la et signale-la à ton enseignant. Ce jeu est un complément : rien ne vaut un bon cahier de notes de cours pour étudier.</div>
      <h3>Pour ta réflexion (C3)</h3>
      <p>Les humanistes que tu as rencontrés sont des hommes lettrés et aisés. Quels groupes de la société (clergé, noblesse, bourgeoisie, artisans, paysans) ne parlent presque jamais dans nos sources? Si l'histoire de la Renaissance était racontée par une paysanne plutôt que par Érasme, qu'est-ce qui changerait dans le récit?</p>
      <div class="btnrow"><button class="btn gold" type="button" id="eC">Ouvrir le carnet</button><button class="btn" type="button" id="eR">Rejouer avec une autre famille</button><button class="btn ghost" type="button" id="eT">Écran titre</button></div>`, () => { if (S.scene === 'end') Game.title(); });
    const g = $('#ep').getContext('2d'); g.drawImage(getSprite(playerLook(), 0, 0), 0, 0);
    if (n === 6) certificatePanel($('#certZone')); else $('#certZone').innerHTML = `<div class="fb info">Allume les six étoiles pour obtenir ton certificat d'humaniste.</div>`;
    $('#eC').onclick = () => { Panel.onClose = null; Game.carnet(); Panel.onClose = () => Game.end(); };
    $('#eR').onclick = () => { Panel.onClose = null; Panel.close(); clearSave(); const m = S.mode; S = freshState(); S.mode = m; for (const k in cities) delete cities[k]; Game.create(); };
    $('#eT').onclick = () => { Panel.onClose = null; Panel.close(); Game.title(); };
  }
};

/* ---------- HUD et interface ---------- */
function updateHUD() {
  if (city) $('#hudPlace').innerHTML = `${esc(city.name)}<small>${esc(city.date)}</small>`;
  const box = $('#hudStars'); box.innerHTML = '';
  IDEAS.forEach(I => { const c = document.createElement('canvas'); drawStar(c, !!S.ideas[I.id], 13, DISC[I.disc].color); c.title = S.ideas[I.id] ? I.name : 'Idée à découvrir'; box.appendChild(c); });
  const sep = document.createElement('span'); sep.className = 'hud-sep'; box.appendChild(sep);
  BONUSES.forEach(I => { const cb = document.createElement('canvas'); drawStar(cb, !!S.ideas[I.id], 13, DISC[I.disc].color); cb.title = S.ideas[I.id] ? I.name + ' (bonus)' : 'Étoile bonus : ' + (I.id === 'antiquite' ? `fragments de l'Antiquité ${nFrags()} / 3` : 'à découvrir à Florence'); box.appendChild(cb); });
}
function showCityUI() {
  $('#hud').hidden = false;
  const t = S.touch || 'auto';
  $('#touch').hidden = !(t === 'on' || (t === 'auto' && isTouch));
}
function hideCityUI() { $('#hud').hidden = true; $('#touch').hidden = true; $('#hint').hidden = true; }
function applyMode(noSave) { document.body.classList.toggle('classe', S.mode === 'classe'); if (!noSave && S.name) save(); }
$('#btnCarnet').onclick = () => { Snd.init(); Game.carnet(); };
$('#btnMenu').onclick = () => { Snd.init(); Game.menu(); };
onAction = () => { Snd.init(); if (Dialog.open) { Dialog.advance(); return; } doAction(); };
onEscape = () => { if (!$('#unlock').hidden) return; if (!$('#panel').hidden) { Panel.close(); return; } if (S.scene === 'city' && !Dialog.open) Game.menu(); };
onCarnet = () => { if (!Dialog.open && S.scene === 'city') Game.carnet(); };

/* ---------- Carte de voyage ---------- */

  ll(lon, lat) { return [(lon + 6) / 26 * W, (56 - lat) / 16 * H]; },
  routes: {
    anvers: [[11.25, 43.77], [11.34, 44.49], [9.19, 45.46], [7.17, 45.87], [6.14, 46.2], [5.04, 47.32], [4.03, 49.26], [4.35, 50.85], [4.40, 51.22]],
    cologne: [[4.40, 51.22], [5.69, 50.85], [6.08, 50.78], [6.96, 50.94]]
  },
  start(from, to) { this.from = from; this.to = to; this.p = 0; if (!this.base) this.base = this.drawBase(); },
  drawBase() {
    const c = document.createElement('canvas'); c.width = W; c.height = H; const g = c.getContext('2d');
    const ll = (a) => this.ll(a[0], a[1]);
    const poly = (pts, col) => { g.beginPath(); pts.map(ll).forEach((p, i) => i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1])); g.closePath(); g.fillStyle = col; g.fill(); g.strokeStyle = '#7a5a36'; g.lineWidth = 1; g.stroke(); };
    g.fillStyle = '#ead8aa'; g.fillRect(0, 0, W, H);
    for (let i = 0; i < 400; i++) { g.fillStyle = `rgba(120,90,40,${Math.random() * .06})`; g.fillRect(Math.random() * W, Math.random() * H, 2, 2); }
    const sea = '#a7c1c2';
    poly([[-6, 56], [8.5, 56], [8.6, 54.0], [7, 53.5], [5, 53.3], [4.7, 52.9], [4.4, 52.2], [3.6, 51.4], [2.5, 51.1], [1.6, 50.9], [1.6, 50.2], [0.2, 49.7], [-1.3, 49.7], [-1.9, 48.7], [-4.7, 48.4], [-6, 48.3]], sea);
    poly([[-5.7, 50.0], [-3, 50.6], [-1, 50.8], [1.4, 51.2], [1.7, 52.6], [0.3, 53.4], [-0.3, 54.5], [-1.5, 55.6], [-2, 56], [-5, 56], [-4.8, 54.8], [-3.2, 54.0], [-3, 53.4], [-4.6, 53.3], [-4.2, 52.0], [-5.2, 51.7], [-3.2, 51.3]], '#ead8aa');
    poly([[10.5, 56], [10.3, 55.3], [9.9, 54.8], [10.9, 54.3], [12.5, 54.4], [14, 54.1], [16, 54.5], [18.5, 54.8], [20, 54.9], [20, 56]], sea);
    poly([[-6, 48.3], [-4.5, 47.8], [-2.3, 47.2], [-1.2, 46.2], [-1.2, 44.6], [-1.8, 43.4], [-6, 43.4]], sea);
    poly([[0.5, 40], [0.9, 41.0], [3.2, 41.9], [3.1, 42.5], [3.9, 43.5], [5.0, 43.4], [6.4, 43.1], [7.5, 43.8], [8.8, 44.4], [9.8, 44.1], [10.3, 43.5], [10.5, 42.9], [11.2, 42.4], [12.3, 41.7], [13.0, 41.2], [14.0, 40.8], [15.0, 40.2], [15.6, 40.0]], sea);
    poly([[12.2, 45.5], [13.0, 45.7], [13.8, 45.6], [14.5, 45.2], [15.2, 44.3], [16.0, 43.5], [17.5, 43.0], [18.5, 42.4], [19.4, 41.9], [19.4, 40.4], [19.3, 40.0], [18.5, 40.1], [17.2, 40.5], [16.9, 41.1], [15.9, 41.6], [16.1, 41.9], [14.7, 42.1], [13.6, 43.5], [12.4, 44.2], [12.3, 44.9]], sea);
    poly([[8.6, 41.4], [9.4, 41.4], [9.5, 42.9], [9.3, 43.0], [8.6, 42.3]], '#ead8aa');
    poly([[8.2, 40.0], [9.8, 40.0], [9.8, 41.1], [9.2, 41.3], [8.2, 40.9]], '#ead8aa');
    // hachures de mer
    g.strokeStyle = 'rgba(60,90,100,.35)';
    for (let i = 0; i < 90; i++) { const x = Math.random() * W, y = Math.random() * H; const d = g.getImageData(x | 0, y | 0, 1, 1).data; if (d[2] > d[0]) { g.beginPath(); g.moveTo(x, y); g.lineTo(x + 3, y - 1); g.lineTo(x + 6, y); g.stroke(); } }
    // Alpes
    g.fillStyle = '#9a8660';
    for (let lon = 6; lon < 14; lon += .7) { const [x, y] = this.ll(lon, 46.4 + Math.sin(lon * 2) * .4); g.beginPath(); g.moveTo(x - 4, y + 3); g.lineTo(x, y - 4); g.lineTo(x + 4, y + 3); g.fill(); g.fillStyle = '#f2ead8'; g.fillRect(x - 1, y - 3, 2, 1); g.fillStyle = '#9a8660'; }
    // Rhin et Escaut
    g.strokeStyle = '#5e8a96'; g.lineWidth = 1.2; g.beginPath(); [[9.5, 47.6], [7.6, 47.6], [8.4, 49], [8.3, 50.0], [7.6, 50.4], [6.96, 50.94], [6.2, 51.8], [4.5, 51.9]].map(a => this.ll(...a)).forEach((p, i) => i ? g.lineTo(...p) : g.moveTo(...p)); g.stroke();
    g.beginPath(); [[3.2, 50.5], [4.4, 51.2], [3.7, 51.4]].map(a => this.ll(...a)).forEach((p, i) => i ? g.lineTo(...p) : g.moveTo(...p)); g.stroke();
    // rose des vents et lignes de rhumb (style portulan)
    const [rx, ry] = [44, 140]; g.strokeStyle = 'rgba(122,42,24,.25)'; g.lineWidth = 1;
    for (let a = 0; a < 16; a++) { const an = a * Math.PI / 8; g.beginPath(); g.moveTo(rx, ry); g.lineTo(rx + Math.cos(an) * 400, ry + Math.sin(an) * 400); g.stroke(); }
    g.fillStyle = '#7a2a18'; for (let a = 0; a < 4; a++) { const an = a * Math.PI / 2; g.beginPath(); g.moveTo(rx + Math.cos(an) * 14, ry + Math.sin(an) * 14); g.lineTo(rx + Math.cos(an + .3) * 4, ry + Math.sin(an + .3) * 4); g.lineTo(rx + Math.cos(an - .3) * 4, ry + Math.sin(an - .3) * 4); g.fill(); }
    g.fillStyle = '#e2ae48'; g.beginPath(); g.arc(rx, ry, 3, 0, 7); g.fill();
    g.strokeStyle = '#6a4a2a'; g.lineWidth = 3; g.strokeRect(1.5, 1.5, W - 3, H - 3); g.strokeStyle = '#c9a46a'; g.lineWidth = 1; g.strokeRect(5, 5, W - 10, H - 10);
    return c;
  },
  render(t, dt) {
    ctx.drawImage(this.base, 0, 0);
    this.p = Math.min(1, this.p + dt / 4.5);
    const drawRoute = (pts, prog, col, dashed) => {
      const P = pts.map(a => this.ll(...a)); const segs = []; let tot = 0;
      for (let i = 1; i < P.length; i++) { const l = Math.hypot(P[i][0] - P[i - 1][0], P[i][1] - P[i - 1][1]); segs.push(l); tot += l; }
      let rem = tot * prog, head = P[0];
      ctx.fillStyle = col;
      for (let i = 1; i < P.length && rem > 0; i++) { const l = segs[i - 1], f = Math.min(1, rem / l); for (let s = 0; s < l * f; s += 3) { const x = P[i - 1][0] + (P[i][0] - P[i - 1][0]) * s / l, y = P[i - 1][1] + (P[i][1] - P[i - 1][1]) * s / l; ctx.fillRect(x | 0, y | 0, 2, 2); } head = [P[i - 1][0] + (P[i][0] - P[i - 1][0]) * f, P[i - 1][1] + (P[i][1] - P[i - 1][1]) * f]; rem -= l; }
      return head;
    };
    if (this.to === 'cologne') drawRoute(this.routes.anvers, 1, 'rgba(122,42,24,.45)');
    const head = drawRoute(this.routes[this.to], this.p, '#7a2a18');
    // villes
    const C = { Florence: [11.25, 43.77], Anvers: [4.40, 51.22], Cologne: [6.96, 50.94] };
    for (const [n, a] of Object.entries(C)) { const [x, y] = this.ll(...a); ctx.fillStyle = '#140d0a'; ctx.fillRect(x - 3, y - 3, 7, 7); ctx.fillStyle = '#b4412b'; ctx.fillRect(x - 2, y - 2, 5, 5); ctx.fillStyle = '#f4d98f'; ctx.fillRect(x - 1, y - 1, 3, 3); }
    const sp = getSprite(playerLook(), 0, Math.floor(t * 8) % 4); ctx.drawImage(sp, (head[0] - 9) | 0, (head[1] - 20) | 0);
    // étiquettes (petite police bitmap)
    for (const [n, a] of Object.entries(C)) { const [x, y] = this.ll(...a); pixText(n.toUpperCase(), x + (n === 'Cologne' ? 6 : n === 'Anvers' ? -30 : 6), y + (n === 'Cologne' ? -2 : n === 'Anvers' ? -11 : -2), '#2a1d13'); }
  }
};
/* petite police pixel 3×5 pour la carte */
const FONT = { A: '010101111101101', B: '110101110101110', C: '011100100100011', E: '111100110100111', F: '111100110100100', G: '011100101101011', I: '111010010010111', L: '100100100100111', N: '110101101101101', O: '010101101101010', R: '110101110101101', S: '011100010001110', V: '101101101101010' };
function pixText(s, x, y, col) {
  x = Math.round(x); y = Math.round(y);
  ctx.fillStyle = 'rgba(234,216,170,.9)'; ctx.fillRect(x - 1, y - 1, s.length * 4 + 1, 7);
  ctx.fillStyle = col;
  [...s].forEach((ch, k) => { const f = FONT[ch]; if (!f) return; for (let i = 0; i < 15; i++) if (f[i] === '1') ctx.fillRect(x + k * 4 + (i % 3), y + ((i / 3) | 0), 1, 1); });
}

/* ---------- Épilogue : la constellation ---------- */
const Epi = {
  t0: 0, pts: { optimisme: [160, 28], raisonnement: [112, 52], critique: [208, 52], individu: [160, 70], croire: [134, 118], tolerance: [186, 118], antiquite: [128, 14], experience: [192, 14] },
  links: [['optimisme', 'individu'], ['individu', 'raisonnement'], ['individu', 'critique'], ['individu', 'croire'], ['individu', 'tolerance']],
  render(t) {
    renderSky(t, { skyline: true });
    const e = performance.now() / 1000 - this.t0;
    const order = ['optimisme', 'raisonnement', 'critique', 'croire', 'tolerance', 'individu', 'antiquite', 'experience'];
    // cercle
    if (e > 3.8) { ctx.save(); ctx.globalAlpha = Math.min(.5, (e - 3.8) * .4); ctx.strokeStyle = '#f4d98f'; ctx.setLineDash([2, 3]); ctx.beginPath(); ctx.arc(160, 74, 54, 0, 7); ctx.stroke(); ctx.restore(); }
    // liens
    this.links.forEach(([a, b], i) => { if (!S.ideas[a] || !S.ideas[b]) return; const k = clamp((e - 2.6 - i * .15) * 1.5, 0, 1); if (k <= 0) return; const A = this.pts[a], Bp = this.pts[b]; ctx.save(); ctx.strokeStyle = 'rgba(244,217,143,.7)'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(A[0], A[1]); ctx.lineTo(A[0] + (Bp[0] - A[0]) * k, A[1] + (Bp[1] - A[1]) * k); ctx.stroke(); ctx.restore(); });
    order.forEach((id, i) => {
      const [x, y] = this.pts[id], on = S.ideas[id], k = clamp((e - .4 - i * .35) * 2, 0, 1); if (k <= 0 || (IDEA[id].bonus && !on)) return;
      const col = on ? DISC[IDEA[id].disc].color : '#4a5290';
      const r = on ? 2 + Math.sin(t * 3 + i) * .6 : 1;
      if (on) { const gr = ctx.createRadialGradient(x, y, 0, x, y, 12 * k); gr.addColorStop(0, 'rgba(255,240,190,.55)'); gr.addColorStop(1, 'rgba(255,240,190,0)'); ctx.fillStyle = gr; ctx.fillRect(x - 12, y - 12, 24, 24); }
      ctx.fillStyle = col; ctx.fillRect(x - r - 2, y, r * 2 + 5, 1); ctx.fillRect(x, y - r - 2, 1, r * 2 + 5); ctx.fillRect(x - 1, y - 1, 3, 3); ctx.fillStyle = '#fffbe8'; ctx.fillRect(x, y, 1, 1);
    });
  }
};

/* ---------- Mise à l'échelle ---------- */
function fit() {
  const iw = window.innerWidth, ih = window.innerHeight;
  let s = Math.min(iw / W, ih / H); if (s >= 2) s = Math.floor(s);
  const st = $('#stage'); st.style.width = W * s + 'px'; st.style.height = H * s + 'px';
  document.documentElement.style.setProperty('--u', s + 'px');
  document.documentElement.style.setProperty('--sw', Math.max(360, W * s - 24) + 'px');
  const portrait = ih > iw * 1.15; document.body.classList.toggle('portrait', portrait);
  if (portrait) document.documentElement.style.setProperty('--below', (H * s + 16) + 'px');
}
window.addEventListener('resize', fit);

/* ---------- Boucle principale ---------- */
let lastT = performance.now(), TT = 0, saveT = 0, objT = 0;
function idleNPCs() {
  if (Dialog.open) return;
  for (const n of city.npcs) { if (Math.random() < .06 && Math.abs(n.x - player.x) + Math.abs(n.y - player.y) > 2) n.dir = [0, 0, 1, 2][Math.floor(Math.random() * 4)]; }
}
function fade(fn) {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) { fn(); return; }
  const f = $('#fade'); f.classList.add('on'); setTimeout(() => { fn(); setTimeout(() => f.classList.remove('on'), 60); }, 290);
}
function frame(now) {
  const dt = Math.min(.05, (now - lastT) / 1000); lastT = now; TT += dt;
  try {
    Snd.tick(); Snd.ambient(S.scene === 'city' && city ? city.id : null); Dialog.tick(dt); $('#touch').classList.toggle('dim', Dialog.open || !$('#panel').hidden);
    if (S.scene === 'city' && city) {
      updatePlayer(dt); updateParticles(dt, TT); renderCity(TT);
      objT += dt; if (objT > .4) { objT = 0; const o = objective(); if ($('#hudObj').dataset.o !== o) { $('#hudObj').dataset.o = o; $('#hudObj').innerHTML = '<b>Objectif</b> ' + esc(o); } idleNPCs(); }
      saveT += dt; if (saveT > 4) { saveT = 0; S.pos = { c: city.id, x: player.x, y: player.y, dir: player.dir }; save(); }
    } else if (S.scene === 'travel') Travel.render(TT, dt);
    else if (S.scene === 'epilogue' || S.scene === 'end') Epi.render(TT);
    else { renderSky(TT); if (Game._pv) Game._pv(); }
  } catch (err) { console.error(err); }
  requestAnimationFrame(frame);
}
fit(); applyMode(true); Game.title(); requestAnimationFrame(frame);
</script>

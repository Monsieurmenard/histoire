<!doctype html><html lang="fr"><head><title>Le Ciel des humanistes</title><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body>
<title>Le Ciel des humanistes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400;0,500;0,700;1,400&family=IM+Fell+English:ital@0;1&family=Pixelify+Sans:wght@400;500;600;700&display=swap">
<style>
:root{
  color-scheme: dark;
  --night:#0f1433; --lapis:#1f2b63; --lapis2:#2e3f8c; --lapis3:#4a5fb8;
  --gold:#e2ae48; --gold2:#f4d98f; --gold3:#a8781f;
  --parch:#f2e6c8; --parch2:#e6d3a6; --parch3:#cdb57f;
  --ink:#2a1d13; --ink2:#5a4632; --vermil:#b4412b; --verd:#3c8a74; --rose:#c86a5a;
  --ok:#2f7d4f; --bad:#a93a2a;
  --u:3px;
  --pix:"Pixelify Sans", "Courier New", monospace;
  --serif:"Alegreya", Georgia, "Times New Roman", serif;
  --fell:"IM Fell English", Georgia, "Times New Roman", serif;
  --fs: clamp(15px, calc(var(--u) * 5.2), 24px);
}
[hidden]{display:none!important;}
html,body{height:100%;}
body{margin:0;background:var(--night);color:var(--parch);font-family:var(--serif);overflow:hidden;
  -webkit-tap-highlight-color:transparent; touch-action:manipulation;}
body.classe{ --fs: clamp(18px, calc(var(--u) * 6.4), 32px); }
#app{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 40%, #182052 0%, var(--night) 70%);}
#stage{position:relative;width:320px;height:180px;box-shadow:0 0 0 1px #000, 0 20px 60px rgba(0,0,0,.6);}
#cv{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;display:block;background:#000;cursor:pointer;}
button{font-family:var(--pix);cursor:pointer;}
button:focus-visible, input:focus-visible, [tabindex]:focus-visible{outline:3px solid var(--gold2);outline-offset:2px;}

/* ---------- HUD ---------- */
#hud{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:flex-start;padding:calc(var(--u)*3);pointer-events:none;gap:8px;}
#hud[hidden]{display:none!important;}
.hud-place{font-family:var(--pix);background:rgba(15,20,51,.78);border:2px solid var(--gold3);color:var(--gold2);padding:4px 10px 5px;border-radius:3px;font-size:clamp(12px, calc(var(--u)*4.2), 20px);line-height:1.15;box-shadow:0 2px 0 #000;}
.hud-place small{display:block;color:var(--parch2);font-size:.72em;font-family:var(--pix);opacity:.9;}
.hud-right{display:flex;flex-direction:column;align-items:flex-end;gap:6px;pointer-events:auto;}
.hud-stars{display:flex;gap:3px;background:rgba(15,20,51,.78);border:2px solid var(--gold3);padding:4px 7px;border-radius:3px;box-shadow:0 2px 0 #000;}
.hud-stars canvas{width:clamp(14px, calc(var(--u)*5), 26px);height:clamp(14px, calc(var(--u)*5), 26px);image-rendering:pixelated;}
.hud-btns{display:flex;gap:6px;}
.hbtn{background:var(--lapis);color:var(--parch);border:2px solid var(--lapis3);border-radius:3px;padding:4px 9px;font-size:clamp(11px, calc(var(--u)*3.6), 17px);box-shadow:0 2px 0 #000;}
.hbtn:hover{background:var(--lapis2);}
.hbtn kbd{font-family:var(--pix);color:var(--gold2);font-size:.85em;}

/* ---------- Dialogue ---------- */
#dialog{position:fixed;z-index:20;left:50%;transform:translateX(-50%);bottom:12px;width:min(94vw, var(--sw, 900px));max-width:1100px;
  display:flex;gap:12px;align-items:stretch;background:var(--parch);color:var(--ink);border:3px solid var(--ink);border-radius:4px;
  box-shadow:0 0 0 3px var(--gold3), 0 6px 0 3px #000;padding:10px 14px 12px;font-size:var(--fs);line-height:1.4;}
#dialog .portrait{flex:0 0 auto;width:calc(var(--fs)*4.2);height:calc(var(--fs)*4.2);background:var(--lapis);border:3px solid var(--ink);border-radius:3px;image-rendering:pixelated;align-self:flex-start;}
#dialog .dbody{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px;}
#dialog .dname{font-family:var(--pix);font-weight:600;color:var(--vermil);font-size:.86em;letter-spacing:.02em;}
#dialog .dname em{font-style:normal;color:var(--ink2);font-weight:400;font-size:.85em;margin-left:6px;}
#dialog .dtext{min-height:2.8em;}
#dialog .dtext b{color:#7a2a18;}
#dialog .dnext{align-self:flex-end;font-family:var(--pix);font-size:.7em;color:var(--ink2);animation:bob 1s steps(2) infinite;}
@keyframes bob{50%{transform:translateY(3px)}}
#dialog .choices{display:flex;flex-direction:column;gap:6px;margin-top:4px;}
#dialog .choices button{font-family:var(--serif);font-size:.92em;text-align:left;background:var(--parch2);color:var(--ink);border:2px solid var(--ink2);border-radius:3px;padding:6px 10px;}
#dialog .choices button:hover, #dialog .choices button:focus-visible, #dialog .choices button.hl{background:var(--gold2);border-color:var(--ink);box-shadow:inset 4px 0 0 var(--vermil);}

/* ---------- Interaction hint ---------- */
#hint{position:absolute;z-index:5;font-family:var(--pix);font-size:clamp(11px, calc(var(--u)*3.4), 16px);background:rgba(15,20,51,.9);color:var(--gold2);border:2px solid var(--gold3);padding:2px 7px;border-radius:3px;transform:translate(-50%,-100%);pointer-events:none;white-space:nowrap;}

/* ---------- Panels (activities, carnet, menus) ---------- */
#panel{position:fixed;z-index:30;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(8,10,28,.72);padding:16px;}
.sheet{position:relative;background:var(--parch);color:var(--ink);width:min(980px, 100%);max-height:100%;overflow:auto;border:3px solid var(--ink);border-radius:4px;
  box-shadow:0 0 0 4px var(--gold3), 0 10px 0 4px #000;padding:clamp(14px, 3vw, 30px);font-size:var(--fs);line-height:1.45;
  background-image:radial-gradient(ellipse at 20% 0%, rgba(255,255,255,.35), transparent 60%), radial-gradient(ellipse at 100% 100%, rgba(160,120,60,.18), transparent 50%);}
.sheet h2{font-family:var(--pix);font-weight:600;font-size:1.35em;margin:0 0 .15em;color:var(--lapis);text-wrap:balance;line-height:1.1;}
.sheet h3{font-family:var(--pix);font-weight:600;font-size:1em;margin:1em 0 .3em;color:var(--vermil);}
.sheet .eyebrow{font-family:var(--pix);text-transform:uppercase;letter-spacing:.12em;font-size:.68em;color:var(--ink2);}
.sheet p{margin:.45em 0;max-width:68ch;}
.sheet .close{position:sticky;top:0;float:right;background:var(--ink);color:var(--parch);border:0;border-radius:3px;padding:5px 10px;font-size:.75em;z-index:2;}
.doc{background:#fbf5e3;border:2px solid var(--parch3);border-left:6px solid var(--gold3);padding:12px 16px;margin:12px 0;border-radius:2px;box-shadow:0 2px 0 rgba(0,0,0,.08);}
.doc .dtype{font-family:var(--pix);font-size:.62em;letter-spacing:.14em;text-transform:uppercase;color:var(--verd);}
.doc blockquote{font-family:var(--fell);font-size:1.05em;margin:.35em 0;line-height:1.45;color:#231709;}
.doc .src{font-size:.72em;color:var(--ink2);margin-top:.4em;}
.doc .src b{color:var(--ink);}
.btnrow{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px;align-items:center;}
.btn{font-family:var(--pix);font-size:.85em;background:var(--lapis);color:var(--parch);border:2px solid var(--ink);border-radius:3px;padding:8px 16px;box-shadow:0 3px 0 var(--ink);}
.btn:hover{background:var(--lapis2);}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink);}
.btn.gold{background:var(--gold);color:var(--ink);}
.btn.gold:hover{background:var(--gold2);}
.btn.ghost{background:transparent;color:var(--ink);}
.btn[disabled]{opacity:.45;cursor:not-allowed;}
.fb{margin-top:10px;padding:10px 14px;border-radius:3px;border:2px solid;}
.fb.ok{background:#e1efdf;border-color:var(--ok);color:#173d25;}
.fb.bad{background:#f5dcd3;border-color:var(--bad);color:#4a150c;}
.fb.info{background:#e3e7f5;border-color:var(--lapis2);color:#1a2250;}
.q{margin-top:14px;}
.q .qp{font-weight:700;}
.opts{display:flex;flex-direction:column;gap:8px;margin-top:8px;}
.opt{display:flex;gap:10px;align-items:center;text-align:left;font-family:var(--serif);font-size:.95em;background:#fbf5e3;color:var(--ink);border:2px solid var(--ink2);border-radius:3px;padding:8px 12px;}
.opt:hover{background:var(--gold2);}
.opt .let{font-family:var(--pix);font-weight:700;background:var(--ink);color:var(--parch);min-width:1.6em;text-align:center;border-radius:2px;padding:0 4px;}
.opt.wrong{opacity:.55;text-decoration:line-through;background:#f0d8cf;}
.opt.right{background:#d8ecd6;border-color:var(--ok);}
.opt .txt{flex:1;}
.vote{display:none;align-items:center;gap:4px;font-family:var(--pix);}
body.classe .vote{display:flex;}
.vote button{width:1.6em;height:1.6em;border:2px solid var(--ink);background:var(--parch2);border-radius:3px;font-size:.8em;line-height:1;padding:0;}
.vote output{min-width:1.6em;text-align:center;font-weight:700;}
.classbar{display:none;gap:10px;align-items:center;margin-top:10px;flex-wrap:wrap;}
body.classe .classbar{display:flex;}
.timer{font-family:var(--pix);font-size:1.1em;min-width:3ch;color:var(--vermil);}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start;}
@media (max-width:760px){.grid2{grid-template-columns:1fr;}}
.mini{width:100%;image-rendering:pixelated;border:3px solid var(--ink);border-radius:2px;background:#000;display:block;touch-action:none;}
.cards{display:grid;grid-template-columns:repeat(auto-fit, minmax(190px,1fr));gap:10px;margin-top:10px;}
.card{font-family:var(--serif);font-size:.9em;text-align:left;background:#fbf5e3;border:2px solid var(--ink2);border-radius:3px;padding:10px 12px;color:var(--ink);}
.card.sel{background:var(--gold2);border-color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink);}
.card.good{background:#d8ecd6;border-color:var(--ok);}
.card.no{background:#f0d8cf;border-color:var(--bad);}
.card small{display:block;margin-top:6px;font-size:.85em;color:var(--ink2);}
.claim{border:2px solid var(--parch3);background:#fbf5e3;border-radius:3px;padding:10px 12px;margin:8px 0;}
.claim .who{font-family:var(--pix);font-size:.7em;color:var(--verd);letter-spacing:.06em;text-transform:uppercase;}
.claim .acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;}
.claim .acts button{font-family:var(--serif);font-size:.85em;background:var(--parch2);border:2px solid var(--ink2);border-radius:3px;padding:4px 10px;color:var(--ink);}
.claim .acts button:hover{background:var(--gold2);}
.claim.done{border-color:var(--ok);}
.claim .res{font-size:.85em;margin-top:6px;}
.typecase{display:grid;grid-template-columns:repeat(5, 1fr);gap:6px;max-width:420px;}
.type{font-family:"Alegreya", Georgia, serif;font-weight:700;font-size:1.5em;height:2em;background:linear-gradient(#9aa0a8,#6d737c);color:#1b1d21;border:2px solid #34373d;border-radius:2px;box-shadow:inset 0 2px 0 rgba(255,255,255,.35);}
.type span{display:inline-block;}
.type.m span{transform:scaleX(-1);}
.type:hover{background:linear-gradient(#b3b9c1,#80868f);}
.forme{display:flex;gap:6px;margin:10px 0;align-items:center;flex-wrap:wrap;}
.slot{width:2.2em;height:2.4em;border:2px dashed var(--ink2);border-radius:2px;display:flex;align-items:center;justify-content:center;font-family:"Alegreya",Georgia,serif;font-weight:700;font-size:1.3em;background:#e9dcbc;color:#1b1d21;cursor:pointer;}
.slot.f{border-style:solid;background:linear-gradient(#9aa0a8,#6d737c);}
.slot.m span{transform:scaleX(-1);display:inline-block;}
.slot.next{box-shadow:0 0 0 3px var(--gold);}
.printout{font-family:var(--fell);font-size:2em;letter-spacing:.12em;background:#fffaf0;border:2px solid var(--parch3);padding:8px 18px;display:inline-block;min-width:6ch;min-height:1.4em;}
.printout span{display:inline-block;}
.printout .m{transform:scaleX(-1);}
.blank{font-family:var(--serif);font-size:.95em;background:var(--gold2);border:2px solid var(--ink);border-radius:3px;padding:0 8px;color:var(--ink);font-style:italic;}
.blank.ok{background:#cfe8cc;border-color:var(--ok);}
.blank.no{background:#f0cfc4;border-color:var(--bad);}
.match{display:grid;gap:10px;}
.match .row{background:#fbf5e3;border:2px solid var(--parch3);border-radius:3px;padding:10px 12px;}
.match .row blockquote{font-family:var(--fell);margin:0 0 6px;}
.match select{font-family:var(--serif);font-size:.9em;padding:4px 6px;background:var(--parch2);color:var(--ink);border:2px solid var(--ink2);border-radius:3px;}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 6px;}
.tab{font-family:var(--pix);background:var(--parch2);color:var(--ink);border:2px solid var(--ink2);border-radius:3px 3px 0 0;padding:5px 12px;font-size:.8em;}
.tab[aria-selected="true"]{background:var(--lapis);color:var(--parch);border-color:var(--ink);}
.idea{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;padding:10px 0;border-bottom:1px dashed var(--parch3);}
.idea canvas{width:40px;height:40px;image-rendering:pixelated;}
.idea .in{font-family:var(--pix);font-weight:600;color:var(--lapis);}
.idea .dis{font-family:var(--pix);font-size:.66em;letter-spacing:.1em;text-transform:uppercase;color:var(--verd);}
.idea.locked .in{color:var(--ink2);}
.tag{display:inline-block;font-family:var(--pix);font-size:.62em;letter-spacing:.08em;text-transform:uppercase;padding:1px 6px;border-radius:2px;background:var(--ink);color:var(--parch);vertical-align:middle;}
.tag.real{background:var(--verd);}
.tag.fict{background:var(--ink2);}

/* ---------- Full screens (title / creation / travel / epilogue) ---------- */
#screen{position:fixed;z-index:25;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;pointer-events:none;}
#screen > *{pointer-events:auto;}
.title-wrap{text-align:center;display:flex;flex-direction:column;align-items:center;gap:clamp(8px,2vh,18px);}
.title-wrap h1{font-family:var(--pix);font-weight:700;color:var(--gold2);font-size:clamp(34px, 7.5vw, 88px);line-height:.95;margin:0;text-shadow:0 4px 0 #6b4a12, 0 8px 0 rgba(0,0,0,.5);letter-spacing:.01em;text-wrap:balance;}
.title-wrap .sub{font-family:var(--fell);font-style:italic;color:var(--parch);font-size:clamp(16px, 2.4vw, 26px);text-shadow:0 2px 0 #000;}
.title-wrap .cities{font-family:var(--pix);color:var(--parch2);letter-spacing:.3em;text-transform:uppercase;font-size:clamp(11px,1.4vw,15px);}
.menu{display:flex;flex-direction:column;gap:10px;min-width:min(320px, 86vw);margin-top:6px;}
.menu .btn{font-size:clamp(15px, 1.8vw, 20px);padding:10px 18px;}
.modes{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;}
.modes button{font-family:var(--pix);background:rgba(15,20,51,.8);color:var(--parch);border:2px solid var(--lapis3);border-radius:3px;padding:6px 12px;font-size:clamp(12px,1.4vw,15px);}
.modes button[aria-pressed="true"]{background:var(--gold);color:var(--ink);border-color:var(--gold2);}
.beta{display:inline-block;vertical-align:top;font-size:.22em;letter-spacing:.12em;background:var(--vermil);color:var(--parch);border:2px solid var(--gold2);border-radius:3px;padding:3px 8px 4px;text-shadow:none;transform:rotate(-6deg) translateY(.4em);box-shadow:0 3px 0 #000;}
.betanote{max-width:560px;font-family:var(--serif);font-size:clamp(13px,1.5vw,16px);line-height:1.4;color:var(--parch);background:rgba(15,20,51,.82);border:1px dashed var(--gold3);border-radius:3px;padding:8px 14px;text-align:left;}
.betanote b{font-family:var(--pix);font-weight:600;color:var(--gold2);}
.credit{font-family:var(--serif);font-style:italic;color:var(--parch2);font-size:clamp(12px,1.3vw,14px);opacity:.85;max-width:640px;line-height:1.4;}
.linkbtn{font:inherit;font-style:normal;font-family:var(--pix);background:none;border:0;border-bottom:1px dotted var(--gold2);color:var(--gold2);padding:0;cursor:pointer;}
.linkbtn:hover{color:#fff;}
.foot{font-family:var(--pix);color:var(--parch3);font-size:12px;opacity:.8;}
.create{width:min(1000px,100%);max-height:100%;overflow:auto;}
.create .grid{display:grid;grid-template-columns:minmax(200px, 300px) 1fr;gap:clamp(12px,3vw,28px);}
@media (max-width:760px){.create .grid{grid-template-columns:1fr;}}
.preview{background:linear-gradient(#2e3f8c, #1f2b63 60%, #3b2f24 60%, #57432f);border:3px solid var(--ink);border-radius:3px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:10px;gap:8px;}
.preview canvas{width:min(200px, 60vw);aspect-ratio:1/1.1;image-rendering:pixelated;}
.preview .pname{font-family:var(--pix);color:var(--gold2);font-size:1.1em;text-align:center;}
.preview .pbg{font-family:var(--pix);color:var(--parch2);font-size:.75em;text-align:center;}
.field{margin:10px 0;}
.field label, .field .lab{display:block;font-family:var(--pix);font-weight:600;font-size:.8em;color:var(--lapis);margin-bottom:4px;}
.nommsg{min-height:1.2em;font-size:.8em;color:var(--bad);margin-top:4px;font-weight:700;}
.field input[type=text].bad{border-color:var(--bad);background:#f8e1da;}
.certbox{margin-top:14px;}
.field input[type=text]{font-family:var(--serif);font-size:1em;width:100%;max-width:360px;padding:6px 10px;border:2px solid var(--ink);border-radius:3px;background:#fffaf0;color:var(--ink);}
.bgcards{display:grid;grid-template-columns:repeat(3, 1fr);gap:8px;}
@media (max-width:620px){.bgcards{grid-template-columns:1fr;}}
.bgcard{text-align:left;font-family:var(--serif);font-size:.85em;background:#fbf5e3;border:2px solid var(--ink2);border-radius:3px;padding:10px;color:var(--ink);display:flex;flex-direction:column;gap:4px;}
.bgcard b{font-family:var(--pix);font-size:1.05em;color:var(--lapis);}
.bgcard .adv{font-size:.9em;color:var(--verd);}
.bgcard[aria-pressed="true"]{background:var(--gold2);border-color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink);}
.swatches{display:flex;gap:6px;flex-wrap:wrap;}
.sw{width:32px;height:32px;border:2px solid var(--ink);border-radius:3px;}
.sw[aria-pressed="true"]{box-shadow:0 0 0 3px var(--gold), 0 0 0 5px var(--ink);}
.seg{display:flex;gap:6px;flex-wrap:wrap;}
.seg button{font-family:var(--serif);font-size:.9em;background:var(--parch2);color:var(--ink);border:2px solid var(--ink2);border-radius:3px;padding:5px 12px;}
.seg button[aria-pressed="true"]{background:var(--lapis);color:var(--parch);border-color:var(--ink);}
.narr{max-width:760px;background:rgba(15,20,51,.86);border:2px solid var(--gold3);border-radius:4px;padding:clamp(14px,3vw,26px);color:var(--parch);font-size:var(--fs);line-height:1.5;box-shadow:0 6px 0 #000;}
.narr .when{font-family:var(--pix);color:var(--gold2);letter-spacing:.1em;text-transform:uppercase;font-size:.75em;}
.narr h2{font-family:var(--pix);font-weight:600;color:var(--gold2);margin:.1em 0 .3em;font-size:1.4em;}
.narr .btn{margin-top:10px;}
.narr-bottom{align-self:flex-end;margin-bottom:2vh;}
.narr.side{max-width:min(460px, 92vw);font-size:clamp(14px, calc(var(--u)*4.2), 19px);padding:14px 18px;}
#screen.left{justify-content:flex-start;align-items:flex-end;}
#screen.right{justify-content:flex-end;align-items:flex-end;}
@media (max-aspect-ratio: 4/3){#screen.right{justify-content:center;}}
body.portrait #app{align-items:flex-start;padding-top:calc(env(safe-area-inset-top,0px) + 8px);}
body.portrait #dialog{top:var(--below,60vh);bottom:auto;}
#touch.dim{opacity:0;pointer-events:none;}
#touch.dim *{pointer-events:none;}

/* ---------- Unlock ---------- */
#unlock{position:fixed;z-index:40;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 42%, rgba(46,63,140,.85), rgba(8,10,28,.95) 70%);padding:16px;}
#unlock .u-in{text-align:center;max-width:720px;display:flex;flex-direction:column;align-items:center;gap:10px;font-size:var(--fs);}
#unlock canvas{width:clamp(90px,16vw,150px);height:clamp(90px,16vw,150px);image-rendering:pixelated;animation:rise 1.2s cubic-bezier(.2,1.4,.4,1) both;}
@keyframes rise{from{transform:translateY(80px) scale(.3);opacity:0}to{transform:none;opacity:1}}
#unlock .u-k{font-family:var(--pix);letter-spacing:.2em;text-transform:uppercase;color:var(--gold);font-size:.75em;}

<script>
"use strict";
/* =========================================================
   LE CIEL DES HUMANISTES — noyau : état, sauvegarde, son, entrées, sprites
   ========================================================= */
const W = 320, H = 180, TS = 16;
const $ = (s, r = document) => r.querySelector(s);

/* ---------- État ---------- */
const SAVE_KEY = 'ciel-humanistes-v1';
function freshState() {

function migrateSave(o) {

  if (o.v === 1) {
    const map = { mesure: 'individu', observer: 'raisonnement', critique: 'critique' }, ni = {};
    for (const k in (o.ideas || {})) if (map[k]) ni[map[k]] = true;
    o.ideas = ni; o.frags = {}; o.v = 2;

  if (o.v !== 2) return null;

}
function clearSave() { try { localStorage.removeItem(SAVE_KEY); } catch (e) { } }
function B(o) { return (o && (o[S.bg] ?? o.def)) ?? ''; }   // texte selon le background
// Code de bêta-testeur donné en classe par l'enseignant
function betaCode(v) { try { return btoa(String(v || '').trim().toUpperCase()) === 'WUFOT1U='; } catch (e) { return false; } }
function addDoc(id) { if (!S.docs.includes(id)) { S.docs.push(id); toast('Document ajouté au carnet'); save(); } }

let toastT = 0;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 2200); }

/* ---------- Son (WebAudio, démarré après un clic) ---------- */
const Snd = {
  ac: null, master: null, musicGain: null, musicOn: false, nextT: 0, step: 0, city: 'title',
  init() { if (this.ac) return; try { const AC = window.AudioContext || window.webkitAudioContext; this.ac = new AC(); this.master = this.ac.createGain(); this.master.gain.value = .5; this.master.connect(this.ac.destination); this.musicGain = this.ac.createGain(); this.musicGain.gain.value = .0; this.musicGain.connect(this.master); } catch (e) { this.ac = null; } },
  tone(f, d = .08, type = 'square', vol = .05, when = 0, dest) {
    if (!this.ac || !S.sound && dest !== this.musicGain) return; if (dest === this.musicGain && !S.music) return;

  blip() { this.tone(520 + Math.random() * 120, .035, 'square', .018); },
  sel() { this.tone(660, .06, 'triangle', .06); this.tone(990, .08, 'triangle', .04, .05); },
  ok() { [523, 659, 784].forEach((f, i) => this.tone(f, .18, 'triangle', .07, i * .07)); },
  bad() { this.tone(196, .2, 'sawtooth', .035); this.tone(147, .25, 'sawtooth', .03, .08); },
  star() { [784, 988, 1175, 1568, 1976].forEach((f, i) => this.tone(f, .5, 'triangle', .06, i * .09)); [392, 494, 587].forEach((f, i) => this.tone(f, 1.1, 'sine', .05, .3 + i * .02)); },
  bump() { this.tone(110, .05, 'square', .03); },
  // petite musique de luth (mode dorien) jouée en boucle
  scales: {

    anvers: [261.6, 293.7, 329.6, 392, 440, 523.3, 587.3], cologne: [220, 261.6, 293.7, 329.6, 349.2, 440, 523.3], sky: [293.7, 349.2, 440, 523.3, 587.3, 698.5]
  },
  pattern: [0, 2, 4, 2, 5, 4, 2, 1, 0, 2, 4, 6, 5, 4, 2, 3],

  setMusic(on) { if (!this.ac) return; this.musicGain.gain.setTargetAtTime(on ? .9 : 0, this.ac.currentTime, .3); },

  amb: null, ambCity: null,
  ambient(cityId) {
    if (!this.ac) return;
    const want = S.sound && ['florence', 'anvers', 'cologne'].includes(cityId) ? cityId : null;
    if (want === this.ambCity) return;
    if (this.amb) { const o = this.amb; o.g.gain.setTargetAtTime(0, this.ac.currentTime, .4); setTimeout(() => { try { o.src.stop(); o.lfo.stop(); } catch (e) { } }, 1500); this.amb = null; }

    const src = this.ac.createBufferSource(); src.buffer = buf; src.loop = true;
    const f = this.ac.createBiquadFilter(); const g = this.ac.createGain(); const lfo = this.ac.createOscillator(); const lg = this.ac.createGain();

    f.type = P[0]; f.frequency.value = P[1]; g.gain.value = 0; lfo.frequency.value = P[3]; lg.gain.value = P[4];
    lfo.connect(lg); lg.connect(g.gain); src.connect(f); f.connect(g); g.connect(this.master);

    this.amb = { src, g, lfo };

/* ---------- Entrées ---------- */
const keys = {};
const DIRS = { up: [0, -1, 3], down: [0, 1, 0], left: [-1, 0, 1], right: [1, 0, 2] };
const KEYMAP = { ArrowUp: 'up', KeyW: 'up', KeyZ: 'up', ArrowDown: 'down', KeyS: 'down', ArrowLeft: 'left', KeyA: 'left', KeyQ: 'left', ArrowRight: 'right', KeyD: 'right' };
let touchDir = null;
let onAction = () => { }, onEscape = () => { }, onCarnet = () => { };
window.addEventListener('keydown', e => {
  const tag = (e.target && e.target.tagName) || '';
  if (tag === 'INPUT' || tag === 'SELECT' || tag === 'TEXTAREA') return;
  const d = KEYMAP[e.code];
  // navigation dans les choix de dialogue (évite qu'un Espace répété choisisse par accident)
  if (typeof Dialog !== 'undefined' && Dialog.open && Dialog.cur && Dialog.cur.choice && !Dialog.typing && !panelOpen()) {
    if (d === 'up' || d === 'down') { e.preventDefault(); Dialog.move(d === 'up' ? -1 : 1); return; }
    if (e.code === 'Space' || e.code === 'Enter' || e.code === 'KeyE') { e.preventDefault(); Dialog.confirm(); return; }
    if (/^Digit[1-4]$/.test(e.code)) { e.preventDefault(); Dialog.confirm(+e.code.slice(5) - 1, true); return; }
  }
  if (d && !panelOpen()) { keys[d] = true; e.preventDefault(); }
  if (e.code === 'Space' || e.code === 'Enter' || e.code === 'KeyE') {
    if (panelOpen() && tag === 'BUTTON') return; // laisse le bouton gérer
    if (!panelOpen()) { e.preventDefault(); onAction(); }
  }

});
window.addEventListener('keyup', e => { const d = KEYMAP[e.code]; if (d) keys[d] = false; });

function panelOpen() { return !$('#panel').hidden || !$('#unlock').hidden; }
function heldDir() {
  if (touchDir) return touchDir;
  for (const d of ['up', 'down', 'left', 'right']) if (keys[d]) return d;
  return null;
}
// d-pad tactile
document.querySelectorAll('.dpad button').forEach(b => {
  const d = b.dataset.d;
  const on = e => { e.preventDefault(); touchDir = d; Snd.init(); };
  const off = e => { e.preventDefault(); if (touchDir === d) touchDir = null; };
  b.addEventListener('pointerdown', on); b.addEventListener('pointerup', off); b.addEventListener('pointerleave', off); b.addEventListener('pointercancel', off);
});
$('#abtn').addEventListener('pointerdown', e => { e.preventDefault(); Snd.init(); onAction(); });
const isTouch = matchMedia('(pointer: coarse)').matches || ('ontouchstart' in window);

/* ---------- Palettes des personnages ---------- */
const SKINS = ['#f3d2b0', '#e2b48b', '#c98e62', '#9a6440', '#6e452b'];
const HAIRS = ['#2a1a12', '#5a3620', '#9a5a2a', '#d6a64a', '#8a8580'];
const BGS = {
  noble: { label: 'Famille noble', top: '#9d2235', top2: '#6d1424', trim: '#e2ae48', bottom: '#3a2140', hat: 'beret', hatc: '#6d1424' },
  religieux: { label: 'Famille religieuse', top: '#2c2f45', top2: '#1b1d2e', trim: '#e9e2cf', bottom: '#1b1d2e', hat: 'cap', hatc: '#1b1d2e' },
  bourgeois: { label: 'Famille bourgeoise', top: '#2f6b5a', top2: '#1f4a3e', trim: '#c9a46a', bottom: '#5a4130', hat: 'wide', hatc: '#4a3526' }
};
function playerLook() {
  const b = BGS[S.bg];
  return { skin: SKINS[S.look.skin], hair: HAIRS[S.look.hair], top: b.top, top2: b.top2, trim: b.trim, bottom: b.bottom, hat: b.hat, hatc: b.hatc, robe: S.look.outfit === 'robe', long: S.look.outfit === 'robe' };
}

/* ---------- Générateur de sprites (chibi 16×20, contour sombre) ---------- */
const spriteCache = new Map();
function lookKey(L) { return JSON.stringify(L); }
function drawPersonRaw(g, L, dir, frame) {
  // g : contexte 18×22, personnage décalé de 1px pour le contour
  const P = (x, y, w, h, c) => { g.fillStyle = c; g.fillRect(x + 1, y + 1, w, h); };
  const step = frame === 1 ? 1 : frame === 3 ? -1 : 0;
  const bob = (frame === 1 || frame === 3) ? 1 : 0;
  const skin = L.skin, hair = L.hair, top = L.top, top2 = L.top2 || top, trim = L.trim || top, bot = L.bottom || '#333';
  const oy = -bob;
  // jambes / pieds
  if (!L.robe) {
    if (dir === 0 || dir === 3) {
      P(5, 15 + oy + (step > 0 ? -1 : 0), 2, 4 - (step > 0 ? -1 : 0), bot); P(9, 15 + oy + (step < 0 ? -1 : 0), 2, 4, bot);
      P(5, 18 + (step > 0 ? 0 : 0), 2, 1, '#241810'); P(9, 18, 2, 1, '#241810');
    } else {
      P(6 + step, 15 + oy, 2, 4, bot); P(8 - step, 15 + oy, 2, 4, top2);
      P(6 + step, 18, 2, 1, '#241810'); P(8 - step, 18, 2, 1, '#241810');
    }
  } else {
    P(5 + (step > 0 ? 1 : 0), 18, 2, 1, '#241810'); P(9 - (step < 0 ? 1 : 0), 18, 2, 1, '#241810');
  }
  // corps
  if (L.robe) { P(4, 10 + oy, 8, 8 - oy, top); P(4, 16, 8, 2, top2); P(3, 13 + oy, 1, 5, top2); P(12, 13 + oy, 1, 5, top2); }
  else { P(4, 10 + oy, 8, 6, top); P(4, 15 + oy, 8, 1, top2); }
  // ceinture / col
  P(4, 13 + oy, 8, 1, L.belt || '#3a2616');
  if (dir !== 3) { P(6, 10 + oy, 4, 1, trim); }
  // bras
  const as = frame % 2 ? 1 : 0;
  if (dir === 0 || dir === 3) { P(3, 11 + oy + as, 1, 4, top2); P(12, 11 + oy + (1 - as), 1, 4, top2); P(3, 15 + oy + as, 1, 1, skin); P(12, 15 + oy + (1 - as), 1, 1, skin); }
  else if (dir === 1) { P(6 - step, 11 + oy, 2, 4, top2); P(6 - step, 15 + oy, 2, 1, skin); }
  else { P(8 + step, 11 + oy, 2, 4, top2); P(8 + step, 15 + oy, 2, 1, skin); }
  if (L.book && dir !== 3) { P(dir === 1 ? 4 : dir === 2 ? 10 : 10, 12 + oy, 3, 3, L.book); }
  // tête
  P(4, 3 + oy, 8, 7, skin);
  P(4, 9 + oy, 8, 1, shade(skin, -.12));
  // cheveux
  const hy = 2 + oy;
  if (dir === 3) { P(4, hy, 8, 7, hair); P(3, hy + 2, 1, 5, hair); P(12, hy + 2, 1, 5, hair); }
  else {
    P(4, hy, 8, 2, hair); P(3, hy + 1, 1, L.long ? 7 : 4, hair); P(12, hy + 1, 1, L.long ? 7 : 4, hair);
    if (dir === 0) { P(4, hy + 2, 2, 1, hair); P(9, hy + 2, 3, 1, hair); }
    if (dir === 1) { P(8, hy + 2, 4, 3, hair); P(4, hy + 2, 1, 1, hair); }
    if (dir === 2) { P(4, hy + 2, 4, 3, hair); P(11, hy + 2, 1, 1, hair); }
    if (L.beard) { if (dir === 0) P(5, 8 + oy, 6, 2, L.beard); else if (dir === 1) P(4, 8 + oy, 5, 2, L.beard); else P(7, 8 + oy, 5, 2, L.beard); }
    // yeux
    const eye = '#1b120c';
    if (dir === 0) { P(6, 6 + oy, 1, 2, eye); P(9, 6 + oy, 1, 2, eye); P(5, 8 + oy, 1, 1, '#e79a8a'); P(10, 8 + oy, 1, 1, '#e79a8a'); }
    if (dir === 1) { P(5, 6 + oy, 1, 2, eye); P(4, 8 + oy, 1, 1, '#e79a8a'); }
    if (dir === 2) { P(10, 6 + oy, 1, 2, eye); P(11, 8 + oy, 1, 1, '#e79a8a'); }
  }
  // chapeaux
  const hc = L.hatc || '#222';
  if (L.hat === 'beret') { P(3, hy - 1, 10, 3, hc); P(4, hy - 2, 7, 1, hc); if (dir !== 3) P(11, hy - 2, 2, 1, '#f1e4c4'); }
  if (L.hat === 'cap') { P(4, hy - 1, 8, 2, hc); P(5, hy - 2, 6, 1, hc); }
  if (L.hat === 'wide') { P(2, hy, 12, 1, hc); P(4, hy - 2, 8, 2, hc); P(4, hy - 1, 8, 1, shade(hc, .2)); }
  if (L.hat === 'hood') { P(3, hy - 1, 10, 3, hc); P(3, hy + 2, 1, 7, hc); P(12, hy + 2, 1, 7, hc); if (dir === 3) P(4, hy, 8, 8, hc); }
  if (L.hat === 'coif') { P(3, hy - 1, 10, 3, '#efe8da'); P(3, hy + 2, 1, 6, '#efe8da'); P(12, hy + 2, 1, 6, '#efe8da'); }
  if (L.hat === 'tonsure') { if (dir === 3) P(6, hy, 4, 2, skin); }
  if (L.hat === 'helmet') { P(3, hy - 1, 10, 3, '#9aa3ad'); P(7, hy - 3, 2, 2, '#9aa3ad'); P(3, hy + 2, 10, 1, '#6b737c'); }
  if (L.hat === 'redhat') { P(2, hy, 12, 1, '#a51f2a'); P(4, hy - 2, 8, 2, '#a51f2a'); }
  if (L.hat === 'scarf') { P(3, hy - 1, 10, 3, hc); P(3, hy + 2, 1, 6, hc); P(12, hy + 2, 1, 6, hc); }
}
function shade(hex, a) {
  let c = hex.replace('#', ''); if (c.length === 3) c = c.split('').map(x => x + x).join('');

class City {
  constructor(id, w, h, ground) {
    Object.assign(this, { id, w, h });
    this.ground = new Array(w * h).fill(ground);
    this.solid = new Uint8Array(w * h);
    this.draws = []; this.sprites = []; this.lights = []; this.npcs = [];
    this.trig = new Map(); this.exits = new Map(); this.water = [];
    this.snow = false; this.st = null;
  }
  idx(x, y) { return y * this.w + x; }
  in(x, y) { return x >= 0 && y >= 0 && x < this.w && y < this.h; }
  fill(type, x, y, w, h) { for (let j = y; j < y + h; j++) for (let i = x; i < x + w; i++) if (this.in(i, j)) this.ground[this.idx(i, j)] = type; }
  block(x, y, w = 1, h = 1, v = 1) { for (let j = y; j < y + h; j++) for (let i = x; i < x + w; i++) if (this.in(i, j)) this.solid[this.idx(i, j)] = v; }
  waterRect(x, y, w, h) { this.fill('water', x, y, w, h); this.block(x, y, w, h); }
  draw(z, fn) { this.draws.push({ z, fn }); }
  sprite(px, py, fn, solidTile) { this.sprites.push({ px, py, fn }); if (solidTile) this.block(solidTile[0], solidTile[1], solidTile[2] || 1, solidTile[3] || 1); }
  light(px, py, r, c = 'rgba(255,190,110,.55)', flick = 0) { this.lights.push({ px, py, r, c, flick }); }
  on(x, y, label, fn) { this.trig.set(x + ',' + y, { label, fn }); }
  exit(x, y, fn) { this.exits.set(x + ',' + y, fn); }
  isSolid(x, y) { return !this.in(x, y) || this.solid[this.idx(x, y)] === 1; }
  bake() {
    const c = document.createElement('canvas'); c.width = this.w * TS; c.height = this.h * TS;
    const g = c.getContext('2d'); g.imageSmoothingEnabled = false;
    this.water = [];
    for (let y = 0; y < this.h; y++) for (let x = 0; x < this.w; x++) {
      const t = this.ground[this.idx(x, y)];
      if (t === 'water') { drawWaterTile(g, x, y, this.waterDeep, this.waterMid); this.water.push([x, y]); }
      else if (t !== 'none') drawGroundTile(g, t, x, y, this.seed || 1);
      if (this.snow && t !== 'water') snowPatch(g, x, y);
    }
    this.draws.sort((a, b) => a.z - b.z).forEach(d => d.fn(g));
    // ombres portées au pied des bâtiments et des objets
    for (let y = 1; y < this.h; y++) for (let x = 0; x < this.w; x++) {
      if (this.solid[this.idx(x, y)] || !this.solid[this.idx(x, y - 1)] || this.ground[this.idx(x, y - 1)] === 'water') continue;
      for (let k = 0; k < 7; k++) { g.fillStyle = `rgba(30,15,40,${.26 * (1 - k / 7)})`; g.fillRect(x * TS, y * TS + k, TS, 1); }
    }
    this.st = c;
  }
}

  { id: 'individu', clue: "Dans l'atelier où l'on peint, un tableau attend d'être vu à hauteur d'homme…", city: 'florence', disc: 'arts', name: 'Individu', sub: "l'être humain au centre",

  disc_q: "Aujourd'hui encore, les étudiants en médecine dissèquent des corps donnés à la science. Pourquoi un livre ou une vidéo ne suffisent-ils pas? Et quelles limites faut-il respecter?" };

const ALL_IDEAS = [...IDEAS, ...BONUSES];
const IDEA = Object.fromEntries(ALL_IDEAS.map(i => [i.id, i]));
const MAIN_Q = ['q_individu', 'q_optimisme', 'q_raisonnement', 'q_tolerance', 'q_critique', 'q_croire'];
const FRAG_CITIES = ['florence', 'anvers', 'cologne'];
function clues(r) { return (r.length === 1 ? 'Il te reste une énigme à percer : ' : 'Il te reste deux énigmes à percer : ') + r.map(i => i.clue).join(' ') ; }
function nReq() { return IDEAS.filter(i => S.ideas[i.id]).length; }
function nFrags() { return FRAG_CITIES.filter(c => (S.frags || {})[c]).length; }
function firstTryCount() { return MAIN_Q.filter(k => S.firstTry[k]).length; }

function docHTML(id, withNote = true) {
  const d = DOCS[id]; if (!d) return '';
  return `<div class="doc"><div class="dtype">${esc(d.type)} · ${esc(d.date)}</div><div style="font-family:var(--pix);font-weight:600;color:var(--lapis);margin-top:2px">${esc(d.titre)}</div>
  ${d.q ? `<blockquote>« ${esc(d.q)} »</blockquote>` : ''}
  <div class="src"><b>Source :</b> ${d.src}</div>
  ${withNote && d.note ? `<p style="font-size:.86em;margin:.5em 0 0">${d.note}</p>` : ''}</div>`;
}

function npc(o) { return Object.assign({ dir: 0, idle: true }, o); }
const say = (n, t) => ({ n, t });
const me = t => ({ n: 'me', t });
const narr = t => ({ n: null, t });
const act = fn => ({ fn });
function remaining(cid) { return IDEAS.filter(i => i.city === cid && !S.ideas[i.id]); }
function fragTrigger(cid, label, doneTxt) { return { frag: true, label, fn: () => { if (S.frags[cid]) Dialog.run([narr(doneTxt)]); else Acts.fragment(cid); }, mark: () => !S.frags[cid] }; }

/* =========================================================
   FLORENCE — septembre 1504 — ARTS
   ========================================================= */
function buildFlorence() {
  const C = new City('florence', 28, 20, 'flag');
  C.name = 'Florence'; C.date = 'septembre 1504'; C.seed = 3;
  C.lighting = { tint: '#fff1dc', sun: 'rgba(255,205,130,.16)', vignette: 'rgba(60,25,10,.35)', rays: .09 };
  C.weather = 'dust';
  C.block(0, 0, 28, 4); C.draw(0, g => drawFlorenceBackdrop(g, 0, 448));
  // Palais de la Seigneurie + tribune (ringhiera)
  C.block(2, 4, 9, 6); C.draw(2, g => drawPalazzo(g, 2, 4));
  C.fill('plat', 2, 10, 9, 1); C.block(2, 11, 9, 1); C.block(7, 11, 1, 1, 0);
  C.draw(3, g => drawRinghiera(g, 2, 10, 10, 7));
  C.sprite(6 * TS + 8, 11 * TS - 1, g => statueDavid(g, 6 * TS + 8, 11 * TS - 1), [6, 10]);
  // maisons de gauche
  C.block(0, 4, 2, 7); C.draw(1, g => house(g, 0, 4, 2, 7, { wall: '#e0c9a0', wallH: 60, shutter: '#5b7a4a' }));
  // Loggia
  C.block(12, 4, 6, 5); C.draw(1, g => drawLoggia(g, 12, 4, 6, 5));
  C.block(18, 4, 2, 5); C.draw(1, g => house(g, 18, 4, 2, 5, { wall: '#cf9f6c', wallH: 50, shutter: '#5b7a4a' }));
  // atelier (bottega) du maître Taddeo
  C.block(20, 4, 6, 5); C.draw(1, g => house(g, 20, 4, 6, 5, { wall: '#e4cfa6', wallH: 52, door: 22, shutter: '#4a6a3a', shop: { a: '#b4412b', b: '#f1e4c4' }, sign: (g, x, wy) => signBracket(g, x + 3 * TS + 14, wy + 6, SIGN.brush) }));
  C.block(26, 4, 2, 5); C.draw(1, g => house(g, 26, 4, 2, 5, { wall: '#d9b98a', wallH: 50, shutter: '#5b7a4a', chimney: true }));
  // mur de jardin et cyprès à droite
  C.block(27, 9, 1, 7);
  C.draw(1, g => { for (let y = 9; y < 16; y++) { P(g, 27 * TS, y * TS, 16, 16, '#c9b391'); P(g, 27 * TS, y * TS, 2, 16, '#a18c6c'); } });
  [9, 11, 13, 15].forEach(y => C.sprite(27 * TS + 8, y * TS + 15, g => cypress(g, 27 * TS + 8, y * TS + 15)));
  // étals, puits
  C.block(14, 13, 2, 1); C.sprite(14 * TS + 1, 14 * TS - 1, g => stall(g, 14 * TS + 1, 14 * TS - 1, '#2e4a9a', '#f1e4c4', ['#e8932a', '#e8932a', '#6d8c3a', '#b4412b']));
  C.block(18, 13, 2, 1); C.sprite(18 * TS + 1, 14 * TS - 1, g => stall(g, 18 * TS + 1, 14 * TS - 1, '#3c8a74', '#f1e4c4', ['#e9e1cf', '#b4412b', '#e2ae48', '#6d5a8a']));
  C.block(10, 14, 1, 1); C.sprite(10 * TS + 8, 15 * TS - 1, g => well(g, 10 * TS + 8, 15 * TS - 1));
  // quai de l'Arno
  C.block(0, 17, 28, 1);
  C.draw(1, g => { for (let x = 0; x < 28; x++) { P(g, x * TS, 17 * TS, 16, 16, '#b6a07c'); P(g, x * TS, 17 * TS, 16, 3, '#d4c19c'); P(g, x * TS, 17 * TS + 13, 16, 3, '#7d6a4c'); P(g, x * TS + 7, 17 * TS + 4, 1, 8, '#9d8a68'); } });
  C.waterRect(0, 18, 28, 2); C.waterDeep = '#3b5f5a'; C.waterMid = '#4c756c';
  C.draw(4, g => drawPonteVecchio(g, 19, 17, 6));
  C.fill('dirt', 0, 12, 1, 3);
  for (let y = 12; y <= 14; y++) C.exit(0, y, () => Game.leaveCity());

  // --- PNJ ---
  const bianca = npc({ id: 'bianca', name: 'Bianca', role: 'marchande de fruits', short: 'à Bianca', x: 2, y: 12, dir: 2, look: LK.bianca,
    mark: () => !S.flags.fl_bianca ? '!' : null,
    talk() {
      if (!S.flags.fl_bianca) return [
        say(this, "Benvenuto! Bienvenue à Florence! Tu arrives au bon moment : la République vient de dévoiler une statue géante devant le Palais de la Seigneurie."),
        say(this, B({ noble: "Avec tes beaux habits, on voit que tu es d'une grande famille. Les gardes du Palais te laisseront passer sans discuter, j'en suis sûre.", religieux: "Tu viens étudier chez les frères? Ici, même les moines parlent de peinture et de statues.", bourgeois: "Tu sais qui a payé le géant? L'Œuvre de la cathédrale, gérée par la guilde de la laine. Des marchands, comme ta famille!" })),
        say(this, "Si tu cherches les idées nouvelles, va voir **l'atelier du maître Taddeo**, à droite, où l'on apprend la perspective. Puis monte voir **le David**, sur la tribune devant le Palais."),
        say(this, "Et devant l'atelier, jette un œil au **vieux marbre antique** que les apprentis dessinent toute la journée. Les savants adorent ces vieilles pierres!"),
        say(this, "Et si tu croises **messer Leonardo**, le peintre aux cheveux longs, près de la Loggia, demande-lui ce qu'il dessine dans ses carnets… si tu as l'estomac solide!"),
        say(this, "Les petites étoiles au-dessus des portes t'indiquent où aller. Les points au-dessus des têtes : des gens qui ont quelque chose à te dire."),
        act(() => { S.flags.fl_bianca = 1; })
      ];
      const r = remaining('florence');
      if (!r.length) return [say(this, "Tu as trouvé les deux étoiles de Florence! La route du nord part à gauche, par là où tu es arrivé. Buon viaggio!")];
      return [say(this, clues(r))];
    }
  });
  const taddeo = npc({ id: 'taddeo', name: 'Maître Taddeo', role: 'peintre', short: 'à Taddeo', x: 21, y: 9, dir: 0, look: LK.taddeo,
    mark: () => !S.ideas.individu ? '!' : null,
    talk() {
      if (S.ideas.individu) return [say(this, "Tu as l'œil! Un jour, tous les peintres d'Europe construiront leurs tableaux comme ça.")];
      return [say(this, "Mon apprenti a encore raté son carrelage! Les lignes partent dans tous les sens, on dirait que les personnages vont glisser hors du tableau."),
        say(this, "Entre dans l'atelier. Je vais te montrer le secret de messer Alberti.", ),
        { n: this, t: "On y va?", choice: [{ t: "Entrer dans l'atelier", fn: () => { Dialog.close(); Acts.perspective(); return 'stop'; } }, { t: "Plus tard", fn: () => 'stop' }] }];
    }
  });
  const garde = npc({ id: 'garde', name: 'Garde de la Seigneurie', short: 'au garde', x: S.flags.fl_open ? 8 : 7, y: S.flags.fl_open ? 12 : 11, dir: S.flags.fl_open ? 3 : 0, look: LK.garde, turn: true,
    mark: () => (S.flags.fl_open ? null : (S.bg === 'noble' || S.flags.fl_pass) ? '!' : null),
    talk() {
      if (S.flags.fl_open) return [say(this, "Admire tant que tu veux, mais ne touche pas au marbre!")];
      if (S.bg === 'noble') return [say(this, "Halte! La tribune est réservée aux ma… Oh, pardon! Je reconnais les couleurs de ta famille. Ton oncle siège au Grand Conseil."),
        say(this, "Monte, je t'en prie. La tribune t'est ouverte."), act(() => { this.x = 8; this.y = 12; this.dir = 3; S.flags.fl_open = 1; addDoc('filarete'); }),
        narr("Avantage de ta famille noble : les portes des puissants s'ouvrent devant toi. Un passant, lui, aurait dû trouver une recommandation. En prime, tu as entendu les débats sur le David : un document est ajouté à ton carnet.")];
      if (S.flags.fl_pass) return [me("J'ai une lettre de la chancellerie, signée par messer Machiavelli."),
        say(this, "Machiavelli? Le secrétaire? Bon, bon… Monte. Mais ne touche pas au marbre!"), act(() => { this.x = 8; this.y = 12; this.dir = 3; S.flags.fl_open = 1; })];
      return [say(this, "Halte! La tribune est réservée aux magistrats et à leurs invités. Sans lettre de la chancellerie, on ne passe pas."),
        narr("Il te faudrait une recommandation. Le secrétaire de la chancellerie se promène souvent près de la Loggia…")];
    }
  });
  const machiavel = npc({ id: 'machiavel', name: 'Nicolas Machiavel', role: 'secrétaire de la République', short: 'à Machiavel', real: true, x: 14, y: 10, dir: 0, look: LK.machiavel,
    mark: () => (!S.flags.fl_open && S.bg !== 'noble' && !S.flags.fl_pass) ? '!' : null,
    talk() {
      const intro = [say(this, "Niccolò Machiavelli, secrétaire de la Seconde Chancellerie. J'écris des lettres pour la République du matin au soir.")];
      if (S.bg === 'noble' && !S.flags.fl_mac) return [...intro, say(this, "Toi, ta famille a des amis au Conseil. Tu n'as pas besoin de moi pour monter sur la tribune."),
        say(this, "Un conseil gratuit : regarde les hommes tels qu'ils sont, pas tels qu'on voudrait qu'ils soient. J'en ferai peut-être un livre un jour."), act(() => S.flags.fl_mac = 1), narr("Machiavel écrira Le Prince en 1513.")];
      if (!S.flags.fl_pass && !S.flags.fl_open) return [...intro, say(this, "Tu veux voir le géant de près, et le garde t'en empêche? Les gardes aiment les papiers. Donnons-lui un papier."),
        act(() => { S.flags.fl_pass = 1; toast('Laissez-passer obtenu'); }), narr("Machiavel griffonne un laissez-passer et le signe."),
        say(this, "Un conseil gratuit : regarde les hommes tels qu'ils sont, pas tels qu'on voudrait qu'ils soient. J'en ferai peut-être un livre un jour."), narr("Machiavel écrira Le Prince en 1513. Retourne voir le garde, devant les marches de la tribune.")];
      return [say(this, "Alors, ce géant? Les Florentins disent qu'il surveille le Palais, prêt à défendre la République contre les tyrans.")];
    }
  });
  const frere = npc({ id: 'frere', name: 'Frère Lorenzo', role: 'dominicain de San Marco', short: 'au frère', x: 21, y: 15, dir: 1, look: LK.frere,
    mark: () => !S.docs.includes('savonarole') ? '?' : null,
    talk() {
      return [say(this, "Il y a six ans, sur cette même place, on a brûlé le frère Savonarole. Avant, c'est lui qui faisait jeter au feu les tableaux, les miroirs et les livres qu'il trouvait trop païens."),
        say(this, "Et aujourd'hui, la ville installe un héros tout nu devant son palais! Les temps changent vite, à Florence."), act(() => addDoc('savonarole'))];
    }
  });
  const garcon = npc({ id: 'garcon', name: 'Piero', role: 'fils de tisserand', short: 'à Piero', x: 12, y: 12, dir: 0, look: LK.garcon, walk: false,
    talk() { return [say(this, "Mon père dit que Léonard de Vinci et Michel-Ange vont peindre chacun une grande bataille dans la salle du Conseil, là, dans le Palais. On dit qu'ils ne se supportent pas!"), say(this, "Moi, plus tard, je serai peintre. Ou banquier. Ce sont les banquiers qui paient les peintres, alors…")]; }
  });
  const vendeuse = npc({ id: 'vendeuse', name: 'Nanna', role: "vendeuse d'oranges", short: 'à Nanna', x: 15, y: 12, dir: 0, look: LK.vendeuse,
    talk() { return [say(this, B({ noble: "Des oranges pour ta maison? Les grandes familles m'achètent tout par paniers entiers!", religieux: "Une orange pour la route? Même les frères de San Marco aiment les douceurs.", bourgeois: "Toi, tu marchandes comme un vrai Florentin! Tes parents t'ont bien appris." })),
      say(this, "Florence est riche grâce à la laine, à la soie et à la banque. Les Médicis étaient les banquiers du pape. Ils payaient les artistes… avant d'être chassés de la ville en 1494.")]; }
  });
  const dame = npc({ id: 'dame', name: 'Donna Ginevra', role: 'épouse de marchand', short: 'à Ginevra', x: 24, y: 12, dir: 1, look: LK.dame,
    talk() { return [say(this, "Mon amie Lisa, la femme du marchand Francesco del Giocondo, fait faire son portrait par Léonard de Vinci. Il y travaille depuis un an et ce n'est toujours pas fini!"),
      say(this, "Avant, on ne peignait que les saints et les rois. Maintenant, on peint aussi les marchands et leurs épouses. Chaque visage humain mérite d'être regardé.")]; }
  });
  const leonard = npc({ id: 'leonard', name: 'Léonard de Vinci', role: 'peintre et ingénieur', short: 'à Léonard', real: true, x: 17, y: 10, dir: 0, look: LK.leonard,
    mark: () => !S.ideas.experience ? '?' : null,
    talk() {
      if (S.ideas.experience) return [say(this, "Va toujours voir par toi-même. Les livres sont des guides, pas des maîtres.")];
      return [say(this, "Leonardo, de Vinci. La République m'a commandé une immense bataille pour la salle du Grand Conseil."),
        say(this, "Mais pour peindre un corps qui court, qui crie, qui se bat, il faut savoir ce qu'il y a sous la peau. Les médecins lisent Galien. Moi, je préfère regarder."),
        { n: this, t: "Veux-tu voir mes carnets? Certaines pages ne sont pas pour les âmes sensibles.", choice: [{ t: 'Montre-moi tes carnets', fn: () => { Dialog.close(); Acts.anatomie(); return 'stop'; } }, { t: 'Plus tard', fn: () => 'stop' }] }];
    }
  });
  C.npcs.push(bianca, taddeo, garde, machiavel, frere, garcon, vendeuse, dame, leonard);
  // --- objets et portes ---
  const bott = { label: "Entrer dans l'atelier", fn: () => { if (S.ideas.individu) Dialog.run([narr("L'atelier sent l'huile de lin et la térébenthine. L'apprenti refait son carrelage… correctement, cette fois.")]); else Acts.perspective(); }, mark: () => !S.ideas.individu };
  C.trig.set('22,8', bott);
  C.on(7, 9, 'Porte du Palais', () => Dialog.run([narr("Les lourdes portes du Palais de la Seigneurie sont fermées. Le Grand Conseil siège.")]));
  const dav = { label: 'Observer le David', fn: () => { if (S.ideas.optimisme) Dialog.run([narr("Le géant regarde au loin, calme et décidé. Un bloc que personne n'osait tailler, devenu le symbole de toute une ville.")]); else Acts.david(); }, mark: () => !S.ideas.optimisme && S.flags.fl_open };
  C.trig.set('6,10', dav);
  C.sprite(25 * TS + 8, 10 * TS - 1, g => marbleTorso(g, 25 * TS + 8, 10 * TS - 1), [25, 9]);
  C.trig.set('25,9', fragTrigger('florence', 'Le marbre antique', "Le vieux torse de marbre attend les apprentis. Tu sais maintenant ce que Michel-Ange a appris des Anciens."));
  C.on(12, 8, 'La Loggia', () => Dialog.run([narr("La Loggia de la Seigneurie : c'est ici que la République tient ses cérémonies publiques. Devant le Palais, le David vient de prendre la place de la Judith de Donatello, qu'on a déplacée.")]));
  C.start = { x: 1, y: 13, dir: 2 };
  return C;
}

/* =========================================================
   ANVERS — septembre 1520 — SCIENCES
   ========================================================= */
function buildAnvers() {
  const C = new City('anvers', 28, 20, 'cobble');
  C.name = 'Anvers'; C.date = 'septembre 1520'; C.seed = 7;
  C.lighting = { tint: '#e9eef3', sun: 'rgba(210,230,255,.14)', vignette: 'rgba(10,25,40,.38)', rays: .05 };
  C.weather = 'sea';
  C.block(0, 0, 18, 7);
  C.draw(0, g => { roofSlate(g, 0, 0, 28 * TS, 20, '#4a5261'); });
  const cols = ['#8e4a36', '#a9674b', '#c7b28a', '#7d4031', '#9c5a44', '#b98b62'];
  for (let i = 0; i < 6; i++) {
    const x = i * 3, o = { type: 'gable', wall: cols[i], steps: 3 + (i % 2), gableH: 28 + (i % 3) * 4 };
    if (i === 1) { o.door = 4; o.sign = (g, x0, y0) => signBracket(g, 5 * TS + 3, 6 * TS - 10, SIGN.globe); }

/* ---------- Question à choix (mode solo ou classe) ---------- */
function makeQuestion(root, q, onRight) {
  const L = 'ABCD';
  const wrap = document.createElement('div'); wrap.className = 'q';
  wrap.innerHTML = `<div class="qp">${q.prompt}</div><div class="opts"></div>
  <div class="classbar"><button class="btn ghost" type="button" data-timer>Minuteur 30 s</button><span class="timer" aria-live="polite"></span><button class="btn" type="button" data-reveal>Révéler le choix de la classe</button></div><div class="fbz" aria-live="polite"></div>`;
  const opts = wrap.querySelector('.opts'), fbz = wrap.querySelector('.fbz');
  const votes = q.opts.map(() => 0); let done = false;
  q.opts.forEach((o, i) => {
    const row = document.createElement('div'); row.style.display = 'flex'; row.style.gap = '8px'; row.style.alignItems = 'stretch';
    const b = document.createElement('button'); b.type = 'button'; b.className = 'opt'; b.style.flex = '1';
    b.innerHTML = `<span class="let">${L[i]}</span><span class="txt">${o.t}</span>`;
    b.onclick = () => choose(i, b);
    const v = document.createElement('div'); v.className = 'vote';
    v.innerHTML = `<button type="button" aria-label="Retirer un vote">−</button><output>0</output><button type="button" aria-label="Ajouter un vote">+</button>`;
    const [minus, out, plus] = v.children;
    minus.onclick = () => { votes[i] = Math.max(0, votes[i] - 1); out.textContent = votes[i]; };
    plus.onclick = () => { votes[i]++; out.textContent = votes[i]; Snd.blip(); };
    row.append(b, v); opts.appendChild(row); o._b = b;
  });
  function choose(i, b) {
    if (done || b.disabled) return;
    const o = q.opts[i]; const n = tryCount(q.id);
    if (o.ok) {
      done = true; Snd.ok(); b.classList.add('right'); if (n === 1) S.firstTry[q.id] = true;
      q.opts.forEach(x => x._b.disabled = true);
      fbz.innerHTML = `<div class="fb ok"><b>Bonne réponse.</b> ${o.fb}</div>`; reveal(fbz);
      const nb = document.createElement('div'); nb.className = 'btnrow'; const go = document.createElement('button'); go.className = 'btn gold'; go.type = 'button'; go.textContent = q.cta || 'Débloquer l\'étoile ★';
      go.onclick = onRight; nb.appendChild(go); fbz.appendChild(nb); setTimeout(() => go.focus(), 50);
      stopTimer();
    } else {
      Snd.bad(); b.classList.add('wrong'); b.disabled = true;
      fbz.innerHTML = `<div class="fb bad"><b>Pas tout à fait.</b> ${o.fb} Essaie une autre réponse.</div>`; reveal(fbz);
    }
  }
  let tmr = null;
  function stopTimer() { if (tmr) { clearInterval(tmr); tmr = null; } }
  wrap.querySelector('[data-timer]').onclick = () => {
    stopTimer(); let s = 30; const el = wrap.querySelector('.timer'); el.textContent = s + ' s';
    tmr = setInterval(() => { s--; el.textContent = s > 0 ? s + ' s' : 'Temps écoulé!'; if (s <= 0) { stopTimer(); Snd.sel(); } }, 1000);
  };
  wrap.querySelector('[data-reveal]').onclick = () => {
    if (done) return; const avail = q.opts.map((o, i) => i).filter(i => !q.opts[i]._b.disabled);
    const tot = votes.reduce((a, b) => a + b, 0); if (!tot) { fbz.innerHTML = `<div class="fb info">Compte d'abord les mains levées avec les boutons + et −.</div>`; return; }
    let best = avail[0]; avail.forEach(i => { if (votes[i] > votes[best]) best = i; });
    choose(best, q.opts[best]._b);
  };
  root.appendChild(wrap);
  return wrap;
}

function pickCards(sh, cards, need, tryId, msgs, onDone) {

  cards.forEach((c, i) => { const b = document.createElement('button'); b.type = 'button'; b.className = 'card'; b.innerHTML = c.t; b.setAttribute('aria-pressed', 'false');
    b.onclick = () => { if (sh.dataset.done) return; if (sel.has(i)) sel.delete(i); else if (sel.size < need) sel.add(i); b.classList.toggle('sel', sel.has(i)); b.setAttribute('aria-pressed', sel.has(i)); sh.querySelector('#cnt').textContent = sel.size + ' / ' + need; Snd.blip(); };
    box.appendChild(b); c._b = b; });
  sh.querySelector('#val').onclick = () => {
    const fb = sh.querySelector('#fb');
    if (sel.size !== need) { fb.innerHTML = `<div class="fb info">Choisis exactement ${need === 3 ? 'trois' : need} cartes.</div>`; reveal(fb); return; }
    tryCount(tryId);
    const good = [...sel].every(i => cards[i].ok);
    cards.forEach(c => { c._b.classList.remove('good', 'no'); const sm = c._b.querySelector('small'); if (sm) sm.remove(); });
    if (good) {
      Snd.ok(); sh.dataset.done = 1;
      cards.forEach(c => { c._b.classList.add(c.ok ? 'good' : 'no'); c._b.insertAdjacentHTML('beforeend', `<small>${c.fb}</small>`); });
      fb.innerHTML = `<div class="fb ok">${msgs.ok}</div><div class="btnrow"><button class="btn gold" type="button" id="nx">${msgs.cta || 'Continuer'}</button></div>`; reveal(fb);
      sh.querySelector('#nx').onclick = onDone; sh.querySelector('#nx').focus();
    } else {
      Snd.bad();
      [...sel].forEach(i => { if (!cards[i].ok) { cards[i]._b.classList.add('no'); cards[i]._b.insertAdjacentHTML('beforeend', `<small>${cards[i].fb}</small>`); } });
      fb.innerHTML = `<div class="fb bad">${msgs.bad}</div>`; reveal(fb);
    }
  };
}

function perspectiveGame(host) {
  const c = document.createElement('canvas'); c.width = 320; c.height = 200; c.className = 'mini'; c.tabIndex = 0; c.style.maxWidth = '680px'; c.style.cursor = 'crosshair';

  host.appendChild(c); const g = c.getContext('2d');

  const bx0 = TV.x * (1 - K), bx1 = TV.x + (320 - TV.x) * K, by0 = TV.y * (1 - K), by1 = TV.y + (200 - TV.y) * K;
  const M = { U: { x: 62, y: 158 }, guides: false, won: false };

    const U = M.U;
    g.clearRect(0, 0, 320, 200);
    // plafond à caissons
    poly([[0, 0], [320, 0], [bx1, by0], [bx0, by0]], '#6b4a33');
    for (let i = 0; i <= 8; i++) { const x = i * 40; line([x, 0], [TV.x + (x - TV.x) * K, by0], '#4a3222'); }
    [1, .8, .64, .52, .43].forEach(k => { const y = TV.y - TV.y * k; line([TV.x - TV.x * k, y], [TV.x + (320 - TV.x) * k, y], '#4a3222'); });
    // murs
    poly([[0, 0], [bx0, by0], [bx0, by1], [0, 200]], '#d8c29a');
    poly([[320, 0], [bx1, by0], [bx1, by1], [320, 200]], '#ccb489');
    // colonnes sur les murs
    [.92, .72, .55].forEach(k => {
      for (const side of [0, 320]) {
        const x = TV.x + (side - TV.x) * k, yt = TV.y - TV.y * k, yb = TV.y + (200 - TV.y) * k, w = 12 * k;
        const x2 = side === 0 ? x : x - w;
        g.fillStyle = '#efe6d2'; g.fillRect(x2, yt, w, yb - yt); g.fillStyle = 'rgba(0,0,0,.12)'; g.fillRect(side === 0 ? x2 + w - 2 : x2, yt, 2, yb - yt);
      }
    });
    // mur du fond avec arcade et paysage
    g.fillStyle = '#e6d3a6'; g.fillRect(bx0, by0, bx1 - bx0, by1 - by0);
    const ax = TV.x - 16, aw = 32, at = by0 + 10;
    const sky = g.createLinearGradient(0, at, 0, by1); sky.addColorStop(0, '#9cc1e0'); sky.addColorStop(1, '#e8dcc0');
    g.fillStyle = sky; g.beginPath(); g.moveTo(ax, by1); g.lineTo(ax, at + 16); g.arc(TV.x, at + 16, 16, Math.PI, 0); g.lineTo(ax + aw, by1); g.closePath(); g.fill();
    g.fillStyle = '#7d9a64'; g.beginPath(); g.moveTo(ax, by1); for (let x = ax; x <= ax + aw; x += 2) g.lineTo(x, TV.y + 4 + Math.sin(x * .3) * 2); g.lineTo(ax + aw, by1); g.fill();
    g.fillStyle = '#4a6a3a'; g.fillRect(TV.x + 6, TV.y - 6, 3, 10);
    // sol en damier (dépend du point choisi)
    g.save(); poly([[0, 200], [320, 200], [bx1, by1], [bx0, by1]]); g.clip();
    g.fillStyle = '#e9dfca'; g.fillRect(0, by1, 320, 200 - by1);
    const ks = []; for (let j = 0; j < 30; j++) { const k = 1 / (1 + .38 * j); if (k < K) { ks.push(K); break; } ks.push(k); }
    const ys = ks.map(k => TV.y + (200 - TV.y) * k);
    const dy = Math.max(6, 200 - U.y);
    const xat = (X, y) => X + (U.x - X) * (200 - y) / dy;
    for (let j = 0; j < ys.length - 1; j++) for (let i = -12; i < 20; i++) {
      if ((i + j) % 2) continue; const X0 = i * 40 - 160, X1 = X0 + 40;
      poly([[xat(X0, ys[j]), ys[j]], [xat(X1, ys[j]), ys[j]], [xat(X1, ys[j + 1]), ys[j + 1]], [xat(X0, ys[j + 1]), ys[j + 1]]], '#8a3f2a');

    // arêtes des murs
    [[[0, 0], [bx0, by0]], [[320, 0], [bx1, by0]], [[0, 200], [bx0, by1]], [[320, 200], [bx1, by1]]].forEach(([a, b]) => line(a, b, '#3a2616', 1.5));
    g.strokeStyle = '#3a2616'; g.lineWidth = 1.5; g.strokeRect(bx0, by0, bx1 - bx0, by1 - by0);

    [[104, .62, '#2e4a9a', '#b4412b'], [222, .8, '#6d1424', '#e2ae48']].forEach(([x, k, c1, c2]) => {
      const fy = TV.y + (200 - TV.y) * k, hgt = (fy - TV.y) / .88, r = hgt * .075;

      g.fillStyle = c1; g.beginPath(); g.moveTo(x - r * 1.5, fy); g.lineTo(x - r * 1.05, TV.y + r * 1.2); g.lineTo(x + r * 1.05, TV.y + r * 1.2); g.lineTo(x + r * 1.5, fy); g.closePath(); g.fill();
      g.fillStyle = c2; g.fillRect(x - r * 1.05, TV.y + r * 1.2, r * 2.1, r * .9);
      g.fillStyle = '#e2b48b'; g.beginPath(); g.arc(x, TV.y, r, 0, 7); g.fill();
      g.fillStyle = '#3a2616'; g.beginPath(); g.arc(x, TV.y - r * .35, r, Math.PI, 0); g.fill();
      g.fillStyle = '#1b120c'; g.fillRect(x - r * .45, TV.y - .5, 1.2, 1.2); g.fillRect(x + r * .3, TV.y - .5, 1.2, 1.2);
    });
    if (M.guides && !M.won) [[[0, 0], [bx0, by0]], [[320, 0], [bx1, by0]], [[0, 200], [bx0, by1]], [[320, 200], [bx1, by1]]].forEach(([a, b]) => { const e = [b[0] + (TV.x - b[0]) * .6, b[1] + (TV.y - b[1]) * .6]; line(b, e, '#b4412b', 1.2, [3, 2]); });
    // lignes du joueur jusqu'au point
    if (!M.won) for (const X of [-40, 80, 240, 360]) { const y0 = by1; line([xat(X, y0), y0], [U.x, U.y], 'rgba(226,174,72,.85)', 1, [2, 2]); }
    if (M.won) { line([0, TV.y], [320, TV.y], 'rgba(46,63,140,.8)', 1, [4, 3]); g.fillStyle = '#1f2b63'; g.font = '8px sans-serif'; g.fillText("ligne d'horizon = hauteur des yeux", 8, TV.y - 3); }
    // marqueur
    g.save(); g.strokeStyle = '#140d0a'; g.lineWidth = 3; g.beginPath(); g.arc(U.x, U.y, 5, 0, 7); g.stroke(); g.strokeStyle = M.won ? '#3c8a74' : '#f4d98f'; g.lineWidth = 1.6; g.beginPath(); g.arc(U.x, U.y, 5, 0, 7); g.stroke();
    g.beginPath(); g.moveTo(U.x - 9, U.y); g.lineTo(U.x - 3, U.y); g.moveTo(U.x + 3, U.y); g.lineTo(U.x + 9, U.y); g.moveTo(U.x, U.y - 9); g.lineTo(U.x, U.y - 3); g.moveTo(U.x, U.y + 3); g.lineTo(U.x, U.y + 9); g.stroke(); g.restore();
  };
  const setFromEvent = e => { const r = c.getBoundingClientRect(); M.U.x = clamp((e.clientX - r.left) / r.width * 320, 4, 316); M.U.y = clamp((e.clientY - r.top) / r.height * 200, 10, 190); M.draw(); };
  let drag = false;
  c.addEventListener('pointerdown', e => { if (M.won) return; drag = true; c.setPointerCapture(e.pointerId); setFromEvent(e); });
  c.addEventListener('pointermove', e => { if (drag) setFromEvent(e); });
  c.addEventListener('pointerup', () => drag = false);
  c.addEventListener('keydown', e => {
    if (M.won) return; const s = e.shiftKey ? 6 : 2; let used = true;
    if (e.key === 'ArrowLeft') M.U.x -= s; else if (e.key === 'ArrowRight') M.U.x += s; else if (e.key === 'ArrowUp') M.U.y -= s; else if (e.key === 'ArrowDown') M.U.y += s; else used = false;
    if (used) { e.preventDefault(); M.U.x = clamp(M.U.x, 4, 316); M.U.y = clamp(M.U.y, 10, 190); M.draw(); }
  });
  M.check = function () {
    const dx = M.U.x - TV.x, dy = M.U.y - TV.y;
    if (Math.hypot(dx, dy) <= 9) { M.won = true; M.U = { ...TV }; M.draw(); return { ok: true }; }
    let msg = "Le carrelage ne file pas vers le même point que les arêtes des murs. ";
    if (Math.abs(dy) > 9) msg += dy > 0 ? "Ton point est trop bas. Regarde les yeux des deux personnages : Alberti place le point de fuite à cette hauteur. " : "Ton point est trop haut. Regarde les yeux des deux personnages : Alberti place le point de fuite à cette hauteur. ";
    if (Math.abs(dx) > 9) msg += dx > 0 ? "Il est aussi trop à droite." : "Il est aussi trop à gauche.";
    if (!M.guides) msg += " Astuce : prolonge les bords des murs.";
    return { ok: false, msg };
  };
  M.draw(); setTimeout(() => c.focus({ preventScroll: true }), 60);
  return M;
}

        { t: "La confiance dans les capacités humaines : par son talent, son travail et sa volonté, l'être humain peut se dépasser et choisir ce qu'il devient.", ok: true, fb: "C'est l'optimisme humaniste. Pic reste chrétien : c'est Dieu qui donne cette liberté à Adam. Mais c'est à l'être humain de s'en servir, pour s'élever… ou pour s'abaisser." },

    }, () => finishActivity('optimisme'));

  step1();

  // rose des vents

  // Anvers

function drawDissection(c, seen) {
  const g = c.getContext('2d'); g.imageSmoothingEnabled = false; c.width = 120; c.height = 72;
  g.fillStyle = '#e9dcbc'; g.fillRect(0, 0, 120, 72); g.fillStyle = '#d6c49c'; g.fillRect(0, 50, 120, 22);
  for (let x = 0; x < 120; x += 10) { g.fillStyle = '#c9b68c'; g.fillRect(x, 50, 1, 22); }
  // la chaire du professeur
  g.fillStyle = '#7a5234'; g.fillRect(4, 22, 26, 34); g.fillStyle = '#946745'; g.fillRect(2, 20, 30, 3); g.fillRect(8, 6, 4, 16); g.fillStyle = '#5a3a22'; g.fillRect(6, 30, 22, 2);
  const lector = { skin: SKINS[0], hair: HAIRS[4], top: '#9d2235', top2: '#6d1424', trim: '#e2ae48', robe: true, hat: 'cap', hatc: '#6d1424', book: '#f2e6c8' };
  g.drawImage(getSprite(lector, 0, 0), 8, 2);
  g.fillStyle = '#f2e6c8'; g.fillRect(13, 14, 7, 4); g.fillStyle = '#8a6a3a'; g.fillRect(16, 14, 1, 4);
  // la table et le corps
  g.fillStyle = '#6a4a2a'; g.fillRect(40, 46, 46, 4); g.fillRect(42, 50, 3, 14); g.fillRect(81, 50, 3, 14);
  g.fillStyle = '#efe2cf'; g.fillRect(42, 41, 42, 5); g.fillStyle = '#e2c9b0'; g.fillRect(44, 40, 7, 6); g.fillStyle = '#b4412b'; g.fillRect(58, 42, 8, 2);
  // l'aide qui découpe et celui qui montre
  const sector = { skin: SKINS[2], hair: HAIRS[1], top: '#e9e1cf', top2: '#c9bfa8', trim: '#8a8580', bottom: '#4a3a2a' };
  const ostensor = { skin: SKINS[1], hair: HAIRS[0], top: '#2e4a9a', top2: '#1f3370', trim: '#e9e1cf', robe: true, hat: 'cap', hatc: '#1f3370' };
  g.drawImage(getSprite(sector, 0, 0), 54, 21); g.fillStyle = '#9aa3ad'; g.fillRect(60, 38, 1, 4);
  g.drawImage(getSprite(ostensor, 1, 0), 92, 26); g.fillStyle = '#5a3a22'; for (let i = 0; i < 12; i++) g.fillRect(93 - i, 38 + i * .3, 1, 1);
  // étiquettes des rôles déjà découverts
  [[19, 'A'], [63, 'B'], [101, 'C']].forEach(([x, l], i) => { g.fillStyle = seen[i] ? '#3c8a74' : '#b4412b'; g.fillRect(x - 4, 64, 9, 7); g.fillStyle = '#fffbe8'; if (seen[i]) { g.fillRect(x - 2, 67, 1, 2); g.fillRect(x - 1, 68, 1, 2); g.fillRect(x, 67, 1, 2); g.fillRect(x + 1, 66, 1, 2); g.fillRect(x + 2, 65, 1, 2); } else { g.font = 'bold 6px sans-serif'; g.fillText(l, x - 2, 70); } });
}

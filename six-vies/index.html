<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Six vies</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:wght@500;700&family=Alegreya:ital,wght@0,400;1,400&family=Bodoni+Moda:ital,opsz,wght@0,6..96,900;1,6..96,500&display=swap">
<style>
:root{
  --paper:#E2E9EB; --rule:#C9D5D9; --margin:#D7A3A0; --card:#FBFAF6; --ink:#1C2328; --ink-2:#465159; --muted:#6B7880; --line:#D9DAD3;
  --red:#A1262A; --red-soft:#F4DEDB;
  --display:"Bodoni Moda","Didot","Bodoni 72",Georgia,serif;
  --text:"Alegreya",Georgia,serif;
  --ui:"Alegreya Sans","Gill Sans","Trebuchet MS",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --paper:#141A1F; --rule:#1F282F; --margin:#4E2A2A; --card:#20272D; --ink:#E9E6DE; --ink-2:#BAC1C5; --muted:#8C979E; --line:#343D44;
    --red:#E77B70; --red-soft:#3B2426;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#141A1F; --rule:#1F282F; --margin:#4E2A2A; --card:#20272D; --ink:#E9E6DE; --ink-2:#BAC1C5; --muted:#8C979E; --line:#343D44;
  --red:#E77B70; --red-soft:#3B2426;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:var(--paper);color:var(--ink);font-family:var(--text);font-size:18px;line-height:1.5;
  background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 31px,var(--rule) 31px,var(--rule) 32px)}
.box{width:min(440px,100%);background:var(--card);border:1px solid var(--line);border-radius:14px;padding:28px 24px 24px;
  box-shadow:0 1px 0 rgba(28,35,40,.06),0 10px 28px -12px rgba(28,35,40,.35);outline:1px solid var(--line);outline-offset:-8px;position:relative}
h1{margin:0;font-family:var(--display);font-weight:900;font-size:clamp(52px,16vw,72px);line-height:.85;letter-spacing:-.02em}
.span{font-family:var(--display);font-style:italic;font-weight:500;font-size:24px;color:var(--red);margin:4px 0 0}
.stamp{position:absolute;top:22px;right:20px;transform:rotate(8deg);border:2.5px solid var(--red);border-radius:5px;padding:2px 9px;color:var(--red);
  font-family:var(--ui);font-weight:700;font-size:14px;letter-spacing:.08em;text-transform:uppercase}
p{margin:14px 0 0;color:var(--ink-2);font-size:16px}
form{margin-top:18px;display:grid;gap:12px}
label{font-family:var(--ui);font-weight:700;font-size:15px}
input[type=password]{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);font:inherit;font-size:20px;letter-spacing:.06em}
input[type=password]:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.keep{display:flex;align-items:center;gap:8px;font-family:var(--ui);font-size:15px;color:var(--ink-2);font-weight:500}
.keep input{width:20px;height:20px;accent-color:var(--red)}
button{min-height:50px;border-radius:10px;border:2px solid var(--red);background:var(--red);color:var(--card);font-family:var(--ui);font-weight:700;font-size:17px;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
button:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.msg{min-height:1.4em;margin:0;font-family:var(--ui);font-size:15px;color:var(--red)}
.foot{margin-top:16px;padding-top:12px;border-top:1px dashed var(--line);font-family:var(--ui);font-size:13px;color:var(--muted)}
noscript{display:block;margin-top:12px;color:var(--red);font-family:var(--ui)}
</style>
</head>
<body>
<main class="box">
  <span class="stamp">Bêta</span>
  <h1>Six vies</h1>
  <div class="span">1840 – 1896</div>
  <p>Accès réservé aux élèves de 4e secondaire de M. Ménard. Entre le mot de passe donné en classe.</p>
  <form id="f" autocomplete="off">
    <label for="pw">Mot de passe</label>
    <input id="pw" type="password" autocapitalize="characters" autocorrect="off" spellcheck="false" required>
    <label class="keep"><input id="keep" type="checkbox" checked> Se souvenir de cet appareil</label>
    <button id="go" type="submit">Entrer</button>
    <p class="msg" id="msg" role="alert" aria-live="assertive"></p>
  </form>
  <noscript>Active JavaScript pour jouer.</noscript>
  <div class="foot">Histoire du Québec et du Canada, 4e secondaire · École Joseph-François-Perrault</div>
</main>

var $ = function(id){ return document.getElementById(id); };
function u8(b){ var s = atob(b), a = new Uint8Array(s.length); for(var i=0;i<s.length;i++) a[i] = s.charCodeAt(i); return a; }
function b64(buf){ var a = new Uint8Array(buf), s = ""; for(var i=0;i<a.length;i++) s += String.fromCharCode(a[i]); return btoa(s); }
function norm(s){ return s.normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/\s+/g,"").toUpperCase(); }
function get(){ try{ return localStorage.getItem(KEY); }catch(e){ return null; } }
function put(v){ try{ if(v) localStorage.setItem(KEY, v); else localStorage.removeItem(KEY); }catch(e){} }

if(!window.crypto || !crypto.subtle){ $("msg").textContent = "Ce navigateur est trop ancien pour ouvrir le jeu. Essaie avec Safari, Chrome ou Edge à jour."; $("go").disabled = true; return; }

function open(key){
  return crypto.subtle.decrypt({ name: "AES-GCM", iv: u8(IV) }, key, u8(DATA)).then(function(buf){
    var html = new TextDecoder().decode(buf);
    document.open(); document.write(html); document.close();
  });
}
function derive(pw){
  return crypto.subtle.importKey("raw", new TextEncoder().encode(norm(pw)), "PBKDF2", false, ["deriveKey"]).then(function(base){
    return crypto.subtle.deriveKey({ name: "PBKDF2", salt: u8(SALT), iterations: ITER, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, true, ["decrypt"]);
  });
}

if(saved){
  crypto.subtle.importKey("raw", u8(saved), "AES-GCM", false, ["decrypt"]).then(open).catch(function(){ put(null); });
}

$("f").addEventListener("submit", function(e){
  e.preventDefault();
  var pw = $("pw").value; if(!pw.trim()) return;
  $("go").disabled = true; $("go").textContent = "Vérification…"; $("msg").textContent = "";
  var k;
  derive(pw).then(function(key){ k = key; return crypto.subtle.decrypt({ name: "AES-GCM", iv: u8(IV) }, key, u8(DATA)); })
  .then(function(){
    if($("keep").checked) return crypto.subtle.exportKey("raw", k).then(function(raw){ put(b64(raw)); });
  })
  .then(function(){ return open(k); })
  .catch(function(){
    $("go").disabled = false; $("go").textContent = "Entrer";
    $("msg").textContent = "Mot de passe incorrect. Vérifie avec ton enseignant.";
    $("pw").select();
